<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการรถเข็น - Nimit Delivery</title>
<style>
:root {
  --primary: #0c4aa6;
  --primary-dark: #083570;
  --primary-light: #e8f0fe;
  --gray: #f0f2f5;
  --text: #0f172a;
  --subtext: #64748b;
  --radius: 14px;
  --green: #16a34a;
  --red: #dc2626;
  --shadow-sm:0 1px 3px rgba(15,23,42,0.05);
  --shadow-md:0 6px 18px rgba(15,23,42,0.07);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Arial',sans-serif; -webkit-tap-highlight-color:transparent; }
body { background:var(--gray); min-height:100vh; padding-bottom:120px; }

/* TOPBAR */
.topbar {
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  padding:14px 16px; color:#fff; display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:100;
}
.back-btn {
  width:38px; height:38px; border:none; border-radius:12px;
  background:rgba(255,255,255,0.18); cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.back-btn svg { width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2.5; }
.topbar-title { font-size:17px; font-weight:800; flex:1; }
.edit-btn { font-size:13px; font-weight:700; background:none; border:none; color:rgba(255,255,255,0.85); cursor:pointer; }

/* TABS */
.tabs-wrap { background:#fff; display:flex; border-bottom:2px solid var(--gray); position:sticky; top:52px; z-index:99; }
.tab-btn {
  flex:1; height:48px; border:none; background:none; font-size:14px;
  font-weight:700; color:var(--subtext); cursor:pointer; position:relative;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.tab-btn.active { color:var(--primary); }
.tab-btn.active::after { content:''; position:absolute; bottom:-2px; left:0; right:0; height:2px; background:var(--primary); border-radius:2px; }
.tab-badge { background:var(--primary); color:#fff; font-size:11px; font-weight:800; min-width:18px; height:18px; border-radius:20px; display:flex; align-items:center; justify-content:center; padding:0 5px; }

/* EMPTY */
.empty-state { text-align:center; padding:80px 24px; }
.empty-icon { width:72px; height:72px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.empty-icon svg { width:34px; height:34px; fill:#cbd5e1; }
.empty-title { font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px; }
.empty-sub { font-size:13px; color:var(--subtext); margin-bottom:20px; }
.empty-action-btn { height:46px; padding:0 28px; border:none; border-radius:12px; background:var(--primary); color:#fff; font-size:14px; font-weight:700; cursor:pointer; }

/* SHOP GROUP */
.shop-group { background:#fff; border-radius:16px; margin:12px 14px; box-shadow:var(--shadow-sm); overflow:hidden; }
.shop-group-header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid #f0f2f5; }
.shop-checkbox { width:20px; height:20px; border-radius:6px; border:2px solid #cbd5e1; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; transition:all 0.15s; }
.shop-checkbox.checked { border-color:var(--primary); background:var(--primary); }
.shop-checkbox svg { width:12px; height:12px; stroke:#fff; fill:none; stroke-width:3; }
.shop-name-link { font-size:14px; font-weight:800; color:var(--text); flex:1; cursor:pointer; display:flex; align-items:center; gap:4px; }
.shop-name-link svg { width:14px; height:14px; fill:var(--subtext); }

/* MENU ITEM */
.menu-item { display:flex; gap:12px; padding:12px 14px; border-bottom:1px solid #f8f9fb; }
.menu-item:last-child { border-bottom:none; }
.menu-item-img { width:80px; height:80px; border-radius:12px; background:#f0f2f5; flex-shrink:0; overflow:hidden; }
.menu-item-img img { width:100%; height:100%; object-fit:cover; }
.menu-item-img-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.menu-item-img-placeholder svg { width:30px; height:30px; fill:#cbd5e1; }
.menu-item-info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; }
.menu-item-name { font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }

/* OPTION CHIP */
.option-chip { background:#fff5f5; border:1px solid #fecaca; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; color:var(--red); display:flex; align-items:center; gap:4px; margin-bottom:8px; cursor:pointer; }
.option-chip svg { width:12px; height:12px; fill:var(--red); }

/* PRICE + QTY ROW */
.price-qty-row { display:flex; align-items:center; justify-content:space-between; }
.item-price { font-size:15px; font-weight:800; color:var(--primary); }
.qty-ctrl { display:flex; align-items:center; gap:8px; }
.qty-btn { width:30px; height:30px; border-radius:8px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; }
.qty-btn.minus { background:#fee2e2; color:var(--red); }
.qty-btn.plus { background:var(--primary); color:#fff; }
.qty-num { font-size:14px; font-weight:800; min-width:22px; text-align:center; color:var(--text); border:1.5px solid #e2e8f0; border-radius:6px; padding:2px 4px; }

/* BOTTOM BAR */
.bottom-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; box-shadow:0 -2px 12px rgba(0,0,0,0.08); padding:12px 16px 22px; z-index:200; }
.total-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.total-label { font-size:14px; font-weight:700; color:var(--subtext); }
.total-amount { font-size:17px; font-weight:800; color:var(--text); }
.confirm-btn {
  width:100%; height:52px; border:none; border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; font-size:16px; font-weight:800; cursor:pointer;
  box-shadow:0 4px 14px rgba(12,74,166,0.3);
}
.confirm-btn:disabled { background:#cbd5e1; box-shadow:none; cursor:not-allowed; }

/* HISTORY TAB */
.history-section { padding:12px 14px; }
.history-date-label { font-size:12px; font-weight:800; color:var(--subtext); text-transform:uppercase; margin:14px 0 8px; }
.history-card { background:#fff; border-radius:14px; padding:14px; box-shadow:var(--shadow-sm); margin-bottom:10px; cursor:pointer; }
.history-card-top { display:flex; justify-content:space-between; margin-bottom:6px; }
.history-order-id { font-size:14px; font-weight:800; color:var(--primary); }
.history-status { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
.status-done { background:var(--green); color:#fff; }
.status-cancelled { background:#fee2e2; color:var(--red); }
.history-shop { font-size:13px; color:var(--text); font-weight:600; margin-bottom:3px; }
.history-items-text { font-size:12px; color:var(--subtext); margin-bottom:6px; }
.history-bottom { display:flex; justify-content:space-between; align-items:center; }
.history-total { font-size:14px; font-weight:800; color:var(--text); }
.reorder-btn { font-size:12px; font-weight:700; color:var(--primary); border:1.5px solid var(--primary); border-radius:8px; padding:4px 12px; background:none; cursor:pointer; }

/* SELECT MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:500; display:none; align-items:flex-end; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; width:100%; border-radius:22px 22px 0 0; padding:20px 16px 36px; max-height:85vh; overflow-y:auto; }
.modal-handle { width:36px; height:4px; background:#e2e8f0; border-radius:2px; margin:0 auto 16px; }
.modal-title { font-size:17px; font-weight:800; color:var(--text); margin-bottom:4px; }
.modal-price { font-size:15px; font-weight:700; color:var(--primary); margin-bottom:16px; }
.option-group { margin-bottom:16px; }
.option-group-title { font-size:13px; font-weight:800; color:var(--text); margin-bottom:4px; display:flex; align-items:center; gap:8px; }
.required-badge { font-size:10px; font-weight:700; background:#fee2e2; color:var(--red); padding:2px 7px; border-radius:20px; }
.option-item { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:12px; border:2px solid #f0f2f5; margin-bottom:6px; cursor:pointer; transition:all 0.15s; }
.option-item.selected { border-color:var(--primary); background:var(--primary-light); }
.option-item-left { display:flex; align-items:center; gap:10px; }
.option-radio { width:18px; height:18px; border-radius:50%; border:2px solid #cbd5e1; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.option-radio.filled { border-color:var(--primary); background:var(--primary); }
.option-radio.filled::after { content:''; width:7px; height:7px; border-radius:50%; background:#fff; }
.option-name { font-size:14px; font-weight:600; color:var(--text); }
.option-extra-price { font-size:13px; font-weight:700; color:var(--primary); }
.og-title-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.og-title{font-size:15px;font-weight:800;color:var(--text);}
.og-required-badge{font-size:10px;font-weight:700;background:#fee2e2;color:#dc2626;padding:2px 8px;border-radius:20px;}
.og-optional-badge{font-size:10px;font-weight:700;background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:20px;}
.og-select-hint{font-size:12px;color:var(--subtext);margin-left:auto;}
.price-picker{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px;border-radius:12px;border:2px solid #f0f2f5;background:#fafbfc;}
.price-step-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:20px;font-weight:800;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.price-step-btn:disabled{background:#cbd5e1;cursor:not-allowed;}
.price-val-wrap{text-align:center;min-width:110px;}
.price-val{font-size:20px;font-weight:800;color:var(--text);}
.price-val-sub{font-size:12px;color:var(--subtext);margin-top:2px;}
.price-range-hint{font-size:12px;color:var(--subtext);text-align:center;margin-top:8px;}
.kg-input-row{display:flex;align-items:center;gap:8px;}
.kg-input-field{flex:1;text-align:center;}
.kg-input-field input{width:100%;height:46px;border:2px solid #eef0f4;border-radius:12px;text-align:center;font-size:16px;font-weight:700;outline:none;}
.kg-input-field input:focus{border-color:var(--primary);}
.kg-input-label{font-size:11px;color:var(--subtext);text-align:center;margin-top:4px;}
.kg-price-hint{font-size:12px;color:var(--subtext);text-align:center;margin-top:10px;}
.kg-price-hint b{color:var(--primary);}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.error-shake{animation:shake 0.4s ease;}
.note-input-modal { width:100%; border:2px solid #e8eaf0; border-radius:12px; padding:12px 14px; font-size:14px; outline:none; resize:none; height:70px; margin-top:4px; font-family:inherit; }
.note-input-modal:focus { border-color:var(--primary); }
.modal-footer { display:flex; gap:10px; margin-top:16px; }
.modal-cancel-btn { flex:1; height:50px; border:2px solid #e2e8f0; border-radius:12px; background:#fff; color:var(--text); font-size:15px; font-weight:700; cursor:pointer; }
.modal-add-btn { flex:2; height:50px; border:none; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(12,74,166,0.28); }
</style>
</head>

<div class="tabs-wrap">

<!-- OPTION MODAL -->

<script>
['switchTab','reorder','init'].forEach(fn=>{window[fn]=window[fn]||function(){const a=arguments;setTimeout(()=>{if(typeof window[fn]==='function')window[fn].apply(null,a);},300);};});

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDoc, query, where, getDocs, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCnBUk0ZKFcwMK0NyYkheux1xPt9bLYhr4",
  authDomain: "nimit-delivery.firebaseapp.com",
  projectId: "nimit-delivery",
  storageBucket: "nimit-delivery.firebasestorage.app",
  messagingSenderId: "233476256130",
  appId: "1:233476256130:web:62ba8f64ad0bf2f92c9f9b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// cart = { shopId: { shopName, items:[{id,name,basePrice,price,qty,options:[],note}] } }
let cart = JSON.parse(localStorage.getItem("cart") || "{}");
let customerData = JSON.parse(localStorage.getItem("customerData") || "{}");
let walletPercent=30, riderPercent=70, baseDeliveryFee=9, deliveryTiers=[];
let gpPercent=0, gpSubPercent=0, gpTiers=[], gpSubTiers=[];
let shopMeta = {};
let shopDeliveryFees = {};

// modal state
let modalShopId = null, modalItem = null, modalSelections = {}, modalSubSelections = {}, modalSubQty = {};

function distanceKm(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function loadSettings(){
  try{
    const snap=await getDoc(doc(db,"settings","pricing"));
    if(snap.exists()){const d=snap.data();walletPercent=d.walletPercent??30;riderPercent=d.riderPercent??70;baseDeliveryFee=d.deliveryFee??9;gpPercent=d.gpPercent||0;gpSubPercent=d.gpSubPercent||0;gpTiers=Array.isArray(d.gpTiers)?d.gpTiers:[];gpSubTiers=Array.isArray(d.gpSubTiers)?d.gpSubTiers:[];deliveryTiers=Array.isArray(d.deliveryTiers)?d.deliveryTiers:[];}
  }catch(e){}
}
// ค่าส่งตามช่วงระยะทาง (กม.) — เหมือน tierGpPercent แต่ใช้ระยะทางแทนราคา คืนค่า "ค่าส่ง" ตรงๆ ไม่ใช่ % แล้ว fallback เป็นค่าส่งสำรองถ้าไกลเกินทุกช่วง/ไม่มีช่วงที่ตั้งไว้เลย
function tierDeliveryFee(km){
  if(Array.isArray(deliveryTiers) && deliveryTiers.length){
    const sorted=[...deliveryTiers].sort((a,b)=>(a.min??0)-(b.min??0));
    for(let i=0;i<sorted.length;i++){
      const t=sorted[i];
      const inRange = i===0
        ? (km>=(t.min??0) && km<=(t.max??Infinity))
        : (km>(t.min??0) && km<=(t.max??Infinity));
      if(inRange) return t.fee||0;
    }
  }
  return baseDeliveryFee;
}

async function loadShopMeta(){
  for(const shopId of Object.keys(cart)){
    try{
      const snap=await getDoc(doc(db,"shops",shopId));
      if(snap.exists()){
        const s=snap.data();
        shopMeta[shopId]={phone:s.phone||'',address:s.address||'',lat:s.lat,lng:s.lng,shopType:s.shopType||'normal'};
        shopDeliveryFees[shopId]=(s.lat&&customerData.lat)?tierDeliveryFee(distanceKm(s.lat,s.lng,customerData.lat,customerData.lng)):baseDeliveryFee;
      }
    }catch(e){shopDeliveryFees[shopId]=0;}
  }
}

function cleanCart(){ Object.keys(cart).forEach(id=>{ if(!cart[id].items?.length) delete cart[id]; }); }

function tierGpPercent(base){
  if(Array.isArray(gpTiers) && gpTiers.length){
    const sorted=[...gpTiers].sort((a,b)=>(a.min??0)-(b.min??0));
    for(let i=0;i<sorted.length;i++){
      const t=sorted[i];
      const inRange = i===0
        ? (base>=(t.min??0) && base<=(t.max??Infinity))
        : (base>(t.min??0) && base<=(t.max??Infinity));
      if(inRange) return t.gp||0;
    }
  }
  return gpPercent||0;
}
function tierGpSubPercent(base){
  if(Array.isArray(gpSubTiers) && gpSubTiers.length){
    const sorted=[...gpSubTiers].sort((a,b)=>(a.min??0)-(b.min??0));
    for(let i=0;i<sorted.length;i++){
      const t=sorted[i];
      const inRange = i===0
        ? (base>=(t.min??0) && base<=(t.max??Infinity))
        : (base>(t.min??0) && base<=(t.max??Infinity));
      if(inRange) return t.gp||0;
    }
  }
  return gpSubPercent||0;
}
function calcPrice(base,menuGp,shopType){
  if(shopType==='proxy') return Math.ceil(base||0);
  return Math.ceil((base||0)*(1+(tierGpPercent(base||0)+(menuGp||0))/100));
}
function calcSubPrice(optPrice,shopType){
  if(shopType==='proxy') return Math.ceil(optPrice||0);
  return Math.ceil((optPrice||0)*(1+tierGpSubPercent(optPrice||0)/100));
}

function calcTotal(){
  return Object.keys(cart).reduce((s,sid)=>s+cart[sid].items.reduce((ss,i)=>ss+i.price*i.qty,0),0);
}

let selectedShops = new Set();

function renderFood(){
  cleanCart();
  const shopIds=Object.keys(cart);
  const totalQty=shopIds.reduce((s,sid)=>s+cart[sid].items.reduce((ss,i)=>ss+i.qty,0),0);
  document.getElementById("food-badge").textContent=totalQty;

  if(!shopIds.length){
    document.getElementById("empty-food").style.display="block";
    document.getElementById("shop-groups").innerHTML="";
    document.getElementById("bottom-bar").style.display="none";

window.changeQty=function(shopId,idx,delta){
  const grp=cart[shopId]; if(!grp) return;
  grp.items[idx].qty+=delta;
  if(grp.items[idx].qty<=0) grp.items.splice(idx,1);
  localStorage.setItem("cart",JSON.stringify(cart));
  renderFood();
}

// HISTORY
async function loadHistory(){
  const phone=customerData.phone||"_";
  try{
    const q=query(collection(db,"orders"),where("customer.phone","==",phone));
    const snap=await getDocs(q);
    const orders=[];
    snap.forEach(d=>orders.push({docId:d.id,...d.data()}));
    orders.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    renderHistory(orders);
  }catch(e){ renderHistory([]); }
}

function renderHistory(orders){
  if(!orders.length){ document.getElementById("empty-history").style.display="block"; document.getElementById("history-list").innerHTML=""; return; }
  document.getElementById("empty-history").style.display="none";
  const statusLabel={pending:"รอรับ",accepted:"รับแล้ว",picking:"ไรเดอร์มา",arrived:"ถึงร้าน",delivering:"กำลังส่ง",done:"เสร็จสิ้น",rejected:"ยกเลิก"};
  document.getElementById("history-list").innerHTML=orders.map(o=>{
    const statusClass=o.status==="done"?"status-done":"status-cancelled";
    const time=o.createdAt?.toDate?o.createdAt.toDate().toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"}):"";
    const items=(o.items||[]).map(i=>i.name).join(", ");
    return `
    <div class="history-card" onclick="window.location.href='track.html?orderId=${o.docId}'">
      <div class="history-card-top">
        <div class="history-order-id">#${o.orderId}</div>
        <div class="history-status ${statusClass}">${statusLabel[o.status]||o.status}</div>
      </div>
      <div class="history-shop">${o.shopName||""}</div>
      <div class="history-items-text">${items}</div>
      <div class="history-bottom">
        <div class="history-total">฿${o.grandTotal||0} · ${time}</div>
        <div style="display:flex;gap:6px">
          ${o.status==="done"&&!localStorage.getItem("reviewed_"+o.docId)?`<button class="reorder-btn" style="background:linear-gradient(135deg,#f59e0b,#d97706)" onclick="event.stopPropagation();localStorage.setItem('reviewed_${o.docId}','1');window.location.href='review.html?orderId=${o.docId}'">⭐ ให้คะแนน</button>`:""}
          ${o.status==="done"?`<button class="reorder-btn" onclick="event.stopPropagation();window.reorder('${o.docId}')">สั่งซ้ำ</button>`:""}
        </div>
      </div>
    </div>`;
  }).join('');
}

window.reorder=async function(docId){
  try{
    const snap=await getDoc(doc(db,"orders",docId));
    if(!snap.exists()) return;
    const o=snap.data();
    if(!cart[o.shopId]) cart[o.shopId]={shopName:o.shopName,items:[]};
    (o.items||[]).forEach(item=>{
      const idx=cart[o.shopId].items.findIndex(i=>i.id===item.id);
      if(idx>=0) cart[o.shopId].items[idx].qty+=item.qty;
      else cart[o.shopId].items.push({...item});
    });
    localStorage.setItem("cart",JSON.stringify(cart));
    switchTab("food");
  }catch(e){ alert("เกิดข้อผิดพลาด: "+e.message); console.error(e); }
}

window.switchTab=function(tab){
  document.getElementById("tab-food").classList.toggle("active",tab==="food");
  document.getElementById("tab-history").classList.toggle("active",tab==="history");
  document.getElementById("food-tab").style.display=tab==="food"?"block":"none";

  document.getElementById("bottom-bar").style.display=(tab==="food"&&Object.keys(cart).length)?"block":"none";
  if(tab==="history") loadHistory();
}

// MODAL (for editing options in cart)
function reconstructSubSelections(item,g,gi,oi){
  const o=g.options[oi]; if(!o||!(o.subGroups||[]).length) return;
  o.subGroups.forEach((sg,sgi)=>{
    const key=`${gi}-${oi}-${sgi}`;
    const wantTitle=`${g.title} → ${sg.title}`;
    const sgType=sg.type||'normal';
    const matches=(item.options||[]).filter(mo=>mo.groupTitle===wantTitle);
    if(sgType==='price'){
      if(matches[0]) modalSubSelections[key]=matches[0].price;
    } else if(sgType==='kg'){
      if(matches[0]){
        const m2=matches[0].name.match(/^(\d+(?:\.\d+)?)\s*กก\.\s*(\d+(?:\.\d+)?)\s*ขีด$/);
        if(m2) modalSubSelections[key]={kg:parseFloat(m2[1])||0,kheed:parseFloat(m2[2])||0};
      }
    } else if(sg.multiSelect){
      const set=new Set();
      matches.forEach(mo=>{
        const qm=mo.name.match(/^(.*) x(\d+)$/);
        const baseName=qm?qm[1]:mo.name;
        const qty=qm?parseInt(qm[2])||1:1;
        const soi=(sg.options||[]).findIndex(so=>so.name===baseName);
        if(soi>=0){ set.add(soi); modalSubQty[`${key}-${soi}`]=qty; }
      });
      modalSubSelections[key]=set;
    } else {
      if(matches[0]){
        const soi=(sg.options||[]).findIndex(so=>so.name===matches[0].name);
        if(soi>=0) modalSubSelections[key]=soi;
      }
    }
  });
}
window.openEditModal=function(shopId,idx){
  const item=cart[shopId].items[idx];
  modalShopId=shopId; modalItem={...item,_idx:idx};
  modalSelections={}; modalSubSelections={}; modalSubQty={};
  // ย้อนสร้างค่าที่เคยเลือกไว้จาก item.options (ค่าสุดท้ายที่บันทึกไว้) กลับมาเป็นรูปแบบที่ใช้แก้ไขได้
  const groups=modalItem.optionGroups||[];
  groups.forEach((g,gi)=>{
    const type=g.type||'normal';
    const matches=(item.options||[]).filter(o=>o.groupTitle===g.title);
    if(type==='price'){
      if(matches[0]) modalSelections[gi]=matches[0].price;
    } else if(type==='kg'){
      if(matches[0]){
        const m2=matches[0].name.match(/^(\d+)\s*กก\.\s*(\d+)\s*ขีด$/);
        if(m2) modalSelections[gi]={kg:parseInt(m2[1])||0,kheed:parseInt(m2[2])||0};
      }
    } else if(g.required){
      if(matches[0]){ const oi=(g.options||[]).findIndex(o=>o.name===matches[0].name); if(oi>=0){ modalSelections[gi]=oi; reconstructSubSelections(item,g,gi,oi); } }
    } else {
      const set=new Set();
      matches.forEach(mo=>{ const oi=(g.options||[]).findIndex(o=>o.name===mo.name); if(oi>=0){ set.add(oi); reconstructSubSelections(item,g,gi,oi); } });
      modalSelections[gi]=set;
    }
  });
  document.getElementById("modal-item-name").textContent=item.name;
  document.getElementById("modal-item-price").textContent=`฿${item.price}`;
  document.getElementById("modal-note").value=item.note||"";
  renderModalBody();
  updateModalBtn();
  document.getElementById("optionModal").classList.add("show");
}

window.selectModalOption=function(gi,oi,isSingle){
  const g=(modalItem?.optionGroups||[])[gi]; if(!g) return;
  if(isSingle){
    const prevOi=modalSelections[gi];
    modalSelections[gi]=modalSelections[gi]===oi?null:oi;
    if(prevOi!=null && prevOi!==modalSelections[gi]) clearModalSubSelectionsFor(gi,prevOi);
  }
  else{
    if(!(modalSelections[gi] instanceof Set)) modalSelections[gi]=new Set();
    if(modalSelections[gi].has(oi)){ modalSelections[gi].delete(oi); clearModalSubSelectionsFor(gi,oi); }
    else{ if(g.maxSelect && modalSelections[gi].size>=g.maxSelect) return; modalSelections[gi].add(oi); }
  }
  renderModalBody(); updateModalBtn();
}
function clearModalSubSelectionsFor(gi,oi){
  Object.keys(modalSubSelections).forEach(key=>{ if(key.startsWith(`${gi}-${oi}-`)) delete modalSubSelections[key]; });
  Object.keys(modalSubQty).forEach(qkey=>{ if(qkey.startsWith(`${gi}-${oi}-`)) delete modalSubQty[qkey]; });
}
window.selectModalSubOptionSingle=function(key,soi){
  modalSubSelections[key] = modalSubSelections[key]===soi ? null : soi;
  renderModalBody(); updateModalBtn();
}
window.selectModalSubOption=function(key,soi){
  if(!(modalSubSelections[key] instanceof Set)) modalSubSelections[key]=new Set();
  if(modalSubSelections[key].has(soi)){ modalSubSelections[key].delete(soi); delete modalSubQty[`${key}-${soi}`]; }
  else{ modalSubSelections[key].add(soi); modalSubQty[`${key}-${soi}`]=1; }
  renderModalBody(); updateModalBtn();
}
window.adjustModalSubOptQty=function(key,soi,delta){
  const qkey=`${key}-${soi}`;
  const cur=modalSubQty[qkey]||1;
  modalSubQty[qkey]=Math.max(1,cur+delta);
  renderModalBody(); updateModalBtn();
}
window.toggleModalSubPriceEnabled=function(key,defaultVal,checked){
  modalSubSelections[key] = checked ? defaultVal : null;
  renderModalBody(); updateModalBtn();
}
window.adjustModalSubPrice=function(key,delta,min,max){
  let val=(modalSubSelections[key]==null?min:modalSubSelections[key])+delta;
  val=Math.max(min,Math.min(max,val));
  modalSubSelections[key]=val;
  renderModalBody(); updateModalBtn();
}
window.toggleModalSubKgEnabled=function(key,checked){
  modalSubSelections[key] = checked ? {kg:0,kheed:0} : null;
  renderModalBody(); updateModalBtn();
}
window.setModalSubKg=function(key,field,value){
  if(!modalSubSelections[key]) modalSubSelections[key]={kg:0,kheed:0};
  let v=Math.max(0,parseFloat(value)||0);
  if(field==='kheed') v=Math.min(9,v);
  modalSubSelections[key][field]=v;
  updateModalBtn();
  const hint=document.querySelector(`#mog-sub-${key} .kg-price-hint`);
  if(hint){
    const [gi,oi,sgi]=key.split('-').map(Number);
    const g=(modalItem?.optionGroups||[])[gi]; const o=g?.options?.[oi]; const sg=o?.subGroups?.[sgi];
    if(sg){
      const cur=modalSubSelections[key]; const totalKheed=(cur.kg||0)*10+(cur.kheed||0);
      const baseAmt=totalKheed*(sg.kgRate||0); const custAmt=baseAmt?calcSubPrice(baseAmt,modalShopType()):0;
      hint.innerHTML=`฿${sg.kgRate||0}/ขีด ${totalKheed?` · ราคาที่ต้องจ่าย <b>฿${custAmt}</b>`:''}`;
    }
  }
}
window.adjustModalPrice=function(gi,delta){
  const g=(modalItem?.optionGroups||[])[gi]; if(!g) return;
  const min=g.priceMin||0, max=g.priceMax||0;
  let val=(modalSelections[gi]==null?min:modalSelections[gi])+delta;
  val=Math.max(min,Math.min(max,val));
  modalSelections[gi]=val;
  renderModalBody(); updateModalBtn();
}
window.setModalKg=function(gi,field,value){
  if(!modalSelections[gi]) modalSelections[gi]={kg:0,kheed:0};
  let v=Math.max(0,parseFloat(value)||0);
  if(field==='kheed') v=Math.min(9,v);
  modalSelections[gi][field]=v;
  updateModalBtn();
  const hint=document.querySelector(`#mog-${gi} .kg-price-hint`);
  if(hint){
    const g=(modalItem?.optionGroups||[])[gi];
    const cur=modalSelections[gi]; const totalKheed=(cur.kg||0)*10+(cur.kheed||0);
    const baseAmt=totalKheed*(g.kgRate||0);
    const custAmt=baseAmt?calcPrice(baseAmt,modalItem.gp,modalShopType()):0;
    hint.innerHTML=`฿${g.kgRate||0}/ขีด ${totalKheed?` · ราคาที่ต้องจ่าย <b>฿${custAmt}</b>`:''}`;
  }
}

function modalSubGroupExtraFor(g,gi,oi,shopType){
  const o=g.options[oi]; if(!o||!(o.subGroups||[]).length) return 0;
  let s=0;
  o.subGroups.forEach((sg,sgi)=>{
    const key=`${gi}-${oi}-${sgi}`;
    const sgType=sg.type||'normal';
    const sel=modalSubSelections[key];
    if(sgType==='price'){ if(sel!=null) s+=calcSubPrice(sel,shopType); }
    else if(sgType==='kg'){ if(sel){ const totalKheed=(sel.kg||0)*10+(sel.kheed||0); const baseAmt=totalKheed*(sg.kgRate||0); if(baseAmt) s+=calcSubPrice(baseAmt,shopType); } }
    else if(sel instanceof Set){ sel.forEach(soi=>{ const so=sg.options[soi]; const qty=modalSubQty[`${key}-${soi}`]||1; s+=calcSubPrice(so?.price||0,shopType)*qty; }); }
    else if(typeof sel==='number'){ const so=sg.options[sel]; if(so) s+=calcSubPrice(so.price||0,shopType); }
  });
  return s;
}
function modalSubGroupSelectedOptionsFor(g,gi,oi){
  const o=g.options[oi]; const out=[]; if(!o||!(o.subGroups||[]).length) return out;
  o.subGroups.forEach((sg,sgi)=>{
    const key=`${gi}-${oi}-${sgi}`;
    const sgType=sg.type||'normal';
    const sel=modalSubSelections[key];
    if(sgType==='price'){ if(sel!=null) out.push({groupTitle:`${g.title} → ${sg.title}`,name:`${sg.title} ฿${sel}`,price:sel}); }
    else if(sgType==='kg'){ if(sel){ const totalKheed=(sel.kg||0)*10+(sel.kheed||0); if(totalKheed>0) out.push({groupTitle:`${g.title} → ${sg.title}`,name:`${sel.kg||0} กก. ${sel.kheed||0} ขีด`,price:totalKheed*(sg.kgRate||0)}); } }
    else if(sel instanceof Set){ sel.forEach(soi=>{ const so=sg.options[soi]; if(so){ const qty=modalSubQty[`${key}-${soi}`]||1; out.push({groupTitle:`${g.title} → ${sg.title}`,name:qty>1?`${so.name} x${qty}`:so.name,price:(so.price||0)*qty}); } }); }
    else if(typeof sel==='number'){ const so=sg.options[sel]; if(so) out.push({groupTitle:`${g.title} → ${sg.title}`,name:so.name,price:so.price||0}); }
  });
  return out;
}
function modalGroupExtra(g,gi){
  const type=g.type||'normal';
  const shopType=modalShopType();
  if(type==='price'){ const val=modalSelections[gi]; return val==null?0:calcPrice(val,modalItem.gp,shopType); }
  if(type==='kg'){ const cur=modalSelections[gi]; if(!cur) return 0; const totalKheed=(cur.kg||0)*10+(cur.kheed||0); const baseAmt=totalKheed*(g.kgRate||0); return baseAmt?calcPrice(baseAmt,modalItem.gp,shopType):0; }
  if(g.required&&modalSelections[gi]!=null){ const opt=g.options[modalSelections[gi]]; return calcSubPrice(opt?.price||0,shopType)+modalSubGroupExtraFor(g,gi,modalSelections[gi],shopType); }
  if(!g.required&&modalSelections[gi] instanceof Set){ let s=0; modalSelections[gi].forEach(oi=>{ const opt=g.options[oi]; s+=calcSubPrice(opt?.price||0,shopType)+modalSubGroupExtraFor(g,gi,oi,shopType); }); return s; }
  return 0;
}
function modalGroupSelectedOptions(g,gi){
  const type=g.type||'normal';
  const out=[];
  if(type==='price'){ const val=modalSelections[gi]; if(val!=null) out.push({groupTitle:g.title,name:`${g.title} ฿${val}`,price:val}); return out; }
  if(type==='kg'){ const cur=modalSelections[gi]; if(cur){ const totalKheed=(cur.kg||0)*10+(cur.kheed||0); if(totalKheed>0) out.push({groupTitle:g.title,name:`${cur.kg||0} กก. ${cur.kheed||0} ขีด`,price:totalKheed*(g.kgRate||0)}); } return out; }
  if(g.required&&modalSelections[gi]!=null){ const opt=g.options[modalSelections[gi]]; out.push({groupTitle:g.title,name:opt?.name||'',price:opt?.price||0}); out.push(...modalSubGroupSelectedOptionsFor(g,gi,modalSelections[gi])); return out; }
  if(!g.required&&modalSelections[gi] instanceof Set){ modalSelections[gi].forEach(oi=>{ const opt=g.options[oi]; out.push({groupTitle:g.title,name:opt?.name||'',price:opt?.price||0}); out.push(...modalSubGroupSelectedOptionsFor(g,gi,oi)); }); }
  return out;
}

function updateModalBtn(){
  if(!modalItem) return;
  const base=calcPrice(modalItem.basePrice,modalItem.gp,modalShopType());
  let extra=0;
  (modalItem.optionGroups||[]).forEach((g,gi)=>{ extra+=modalGroupExtra(g,gi); });
  document.getElementById("modal-add-btn").textContent=`อัปเดต ฿${base+extra}`;
}

window.addToCartFromModal=function(){
  if(!modalShopId||!modalItem) return;
  const idx=modalItem._idx;
  let missing=false;
  function checkSubGroupsMissing(g,gi,oi){
    const o=g.options[oi]; if(!o||!(o.subGroups||[]).length) return;
    o.subGroups.forEach((sg,sgi)=>{
      if(!sg.required) return;
      const key=`${gi}-${oi}-${sgi}`;
      const sgType=sg.type||'normal';
      const sel=modalSubSelections[key];
      const sgMissing = sgType==='price' ? (sel==null)
        : sgType==='kg' ? (!sel || ((sel.kg||0)*10+(sel.kheed||0))===0)
        : sg.multiSelect ? (!(sel instanceof Set) || sel.size===0)
        : (typeof sel!=='number');
      if(sgMissing){ missing=true; const el=document.getElementById(`mog-sub-${key}`); if(el){el.classList.remove('error-shake');void el.offsetWidth;el.classList.add('error-shake');} }
    });
  }
  (modalItem.optionGroups||[]).forEach((g,gi)=>{
    const type=g.type||'normal';
    const isMissing = type==='price' ? false
      : type==='kg' ? (g.required && (!modalSelections[gi] || ((modalSelections[gi].kg||0)*10+(modalSelections[gi].kheed||0))===0))
      : (g.required && modalSelections[gi]==null);
    if(isMissing){ missing=true; const el=document.getElementById(`mog-${gi}`); if(el){el.classList.remove('error-shake');void el.offsetWidth;el.classList.add('error-shake');} }
    if(type==='normal'){
      if(g.required && modalSelections[gi]!=null) checkSubGroupsMissing(g,gi,modalSelections[gi]);
      else if(!g.required && modalSelections[gi] instanceof Set) modalSelections[gi].forEach(oi=>checkSubGroupsMissing(g,gi,oi));
    }
  });
  if(missing) return;
  const options=[]; let extra=0;
  (modalItem.optionGroups||[]).forEach((g,gi)=>{ options.push(...modalGroupSelectedOptions(g,gi)); extra+=modalGroupExtra(g,gi); });
  const base=calcPrice(modalItem.basePrice,modalItem.gp,modalShopType());
  cart[modalShopId].items[idx].options=options;
  cart[modalShopId].items[idx].price=base+extra;
  cart[modalShopId].items[idx].note=document.getElementById("modal-note").value;
  localStorage.setItem("cart",JSON.stringify(cart));
  closeModal();
  renderFood();
}

window.closeModal=function(){ document.getElementById("optionModal").classList.remove("show"); }

async function init(){
  await loadSettings();
  await loadShopMeta();
  renderFood();
}
init();

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
</script>
