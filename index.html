<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimit Delivery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:linear-gradient(135deg,#0c4aa6,#083570);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Arial',sans-serif;
}
.logo-wrap{width:88px;height:88px;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pulse 1.6s ease-in-out infinite}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.brand{color:#fff;font-size:20px;font-weight:800;margin-top:18px;letter-spacing:.3px}
.dots{display:flex;gap:6px;margin-top:14px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);animation:blink 1.4s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="logo-wrap"><img src="/icon-192.png" alt="Nimit Delivery"></div>
<div class="brand">Nimit Delivery</div>
<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<script>
// หน้านี้มีหน้าที่เดียว: โชว์โลโก้แป๊บนึงแล้วพาไปหน้าร้านค้าทันที (ไม่ใช่หน้าจริง แค่ตัวส่งต่อ)
// ทำแบบนี้แทนการพึ่ง vercel.json redirect/rewrite เพราะกฎ "index.html ต้องเป็นหน้าแรกเสมอ" ของระบบ
// โฮสต์ไฟล์แบบนี้ (ใช้กันทุกที่ ไม่ใช่แค่ Vercel) เชื่อถือได้ 100% กว่าการพยายามข้ามกฎนั้นด้วยไฟล์ตั้งค่า
location.replace('/shops.html');
</script>
</body>
</html>
