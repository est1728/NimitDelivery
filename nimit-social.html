function openCrop(file,o){const url=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>toast('เปิดรูปนี้ไม่ได้');
  im.onload=()=>{const W=Math.min(innerWidth-64,o.ratio>1?340:300),H=W/o.ratio,iw=im.naturalWidth,ih=im.naturalHeight,s0=Math.max(W/iw,H/ih);let z=1,ox=0,oy=0;
    sheet(`<div style="font-family:Prompt;font-weight:600;font-size:17px">ปรับรูปให้พอดี</div>${o.cap?'<input class="in" id="cpc" maxlength="80" placeholder="เขียนข้อความใต้รูป (ไม่ใส่ก็ได้)">':''}
    <div id="cst" style="position:relative;width:${W}px;height:${H}px;margin:12px auto;overflow:hidden;touch-action:none;background:#000;border-radius:${o.shape==='circle'?'50%':o.shape==='wide'?'14px':'20px'}"><img id="cim" src="${url}" alt="" style="position:absolute;max-width:none;user-select:none;pointer-events:none"></div>
    <input type="range" id="czm" min="1" max="3" step="0.01" value="1" style="width:100%"><div class="sm" style="text-align:center;margin:4px 0 12px">ลากเพื่อเลื่อน · เลื่อนแถบเพื่อซูม</div>
    <div class="row"><button class="btn g grow" id="cno">ยกเลิก</button><button class="btn grow" id="cok">โอเค ใช้รูปนี้</button></div>`);
    const el=$('cim'),st=$('cst');
    const apply=()=>{const sc=s0*z,mx=Math.max(0,(iw*sc-W)/2),my=Math.max(0,(ih*sc-H)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy));el.style.width=iw*sc+'px';el.style.height=ih*sc+'px';el.style.left=(W/2+ox-iw*sc/2)+'px';el.style.top=(H/2+oy-ih*sc/2)+'px'};apply();
    let dr=null;st.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,ox,oy};st.setPointerCapture(e.pointerId)};st.onpointermove=e=>{if(!dr)return;ox=dr.ox+e.clientX-dr.x;oy=dr.oy+e.clientY-dr.y;apply()};st.onpointerup=()=>{dr=null};
    $('czm').oninput=e=>{z=+e.target.value;apply()};
    $('cno').onclick=()=>{URL.revokeObjectURL(url);closeSheet();if(o.cancel)o.cancel()};
    $('cok').onclick=()=>{const c=document.createElement('canvas');c.width=o.out[0];c.height=o.out[1];const k=o.out[0]/W,sc=s0*z,x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      x.drawImage(im,(W/2+ox-iw*sc/2)*k,(H/2+oy-ih*sc/2)*k,iw*sc*k,ih*sc*k);const d=c.toDataURL('image/jpeg',.72),cap=o.cap?$('cpc').value.trim():'';URL.revokeObjectURL(url);closeSheet();o.done(d,cap)}};
  im.src=url}

function tick(t){if(!$('wh').classList.contains('on'))return;const dt=Math.min(50,t-(tick.l||t));tick.l=t;if(wDrag===null){wV+=(.00018-wV)*Math.min(1,dt*.003);wA+=wV*dt}layout();wRaf=requestAnimationFrame(tick)}
{const w=$('wh');
 w.onpointerdown=e=>{if(e.target.closest('.wx,.wp'))return;wDrag={x:e.clientX,a:wA,m:0,t:performance.now(),tg:e.target.closest('.wc,.wm')};w.setPointerCapture(e.pointerId)};
 w.onpointermove=e=>{if(!wDrag)return;const dx=e.clientX-wDrag.x,now=performance.now(),na=wDrag.a+dx*.007;wDrag.m=Math.max(wDrag.m,Math.abs(dx));wV=Math.max(-.004,Math.min(.004,(na-wA)/Math.max(1,now-(wDrag.t2||wDrag.t))));wDrag.t2=now;wA=na};
 w.onpointerup=()=>{const d=wDrag;wDrag=null;if(!d||d.m>=6)return;if(!d.tg)closeWheel();else if(d.tg.classList.contains('wm')){const u=wOwn===me.handle?me:cache[wOwn]||{};viewImg({img:u.avatar,cap:u.avatarCap||'',h:wOwn})}else{const p=wList[+d.tg.dataset.i];if(p)viewImg({img:p.img,cap:p.cap,h:wOwn,id:p.id})}}}

async function gotQR(t){let h='';const m=t.match(/^nimit:f:([0-9a-f]{32})$/),o=t.match(/^nimit:friend:([a-z0-9_]{3,30})$/);
  try{if(m){const r=await getDocs(query(collection(db,'socialHandles'),where('qrToken','==',m[1])));if(!r.empty)h=r.docs[0].data().handle}else if(o){const u=await getU(o[1]);if(u)h=u.handle}}catch(e){}
  if(!h){if($('sst'))$('sst').textContent='QR นี้ไม่ใช่ QR ของ Nimit หรือไม่พบผู้ใช้ ลองใหม่อีกครั้ง';return false}
  if(h===me.handle){if($('sst'))$('sst').textContent='นี่คือ QR ของคุณเอง';return false}
  const u=(await getU(h))||{name:h};stopCam();
  sheet(`<div style="text-align:center;font-family:Prompt;font-weight:600;font-size:18px">ใช่คนนี้ไหม?</div><div class="card pad row" style="margin:14px 0;cursor:pointer" onclick="closeSheet();openProfile('${esc(h)}')">${avatar(h,u.name)}<div class="grow"><div class="nm">${esc(u.name)}</div><div class="sm">@${esc(h)}${u.bio?' · '+esc(u.bio):''}</div></div><span style="font-size:22px;color:var(--m)">›</span></div>
  <div class="row"><button class="btn g grow" onclick="openScan()">สแกนใหม่</button><button class="btn grow" onclick="confirmAdd('${esc(h)}')">ใช่ เพิ่มเพื่อน</button></div><div class="sm" style="margin-top:10px;text-align:center">แตะที่การ์ดเพื่อดูโปรไฟล์ก่อนได้</div>`);return true}
window.confirmAdd=async h=>{await request(h,true);closeSheet();openProfile(h)};
window.openScan=async()=>{
  sheet(`<div style="font-weight:600;font-size:17px">สแกน QR เพื่อน</div><div style="position:relative;margin-top:10px;overflow:hidden;border-radius:16px"><video id="vd" playsinline muted autoplay style="width:100%;min-height:260px;object-fit:cover;background:#000;display:block"></video><div style="position:absolute;inset:16% 16%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none"></div></div><div class="sm" id="sst" style="margin:10px 0">กำลังเปิดกล้อง...</div><label class="btn g full" style="display:block;text-align:center;cursor:pointer">เลือกรูป QR จากเครื่อง<input type="file" accept="image/*" hidden onchange="scanFile(this)"></label>`);
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('vd');v.srcObject=stream;await v.play();$('sst').textContent='เล็งกล้องไปที่ QR ของเพื่อน';
    const det=window.BarcodeDetector?new BarcodeDetector({formats:['qr_code']}):null,c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});let busy=0,bad='';
    if(!det&&!window.jsQR)$('sst').textContent='โหลดตัวสแกนไม่ได้ ลองเลือกรูป QR หรือรีเฟรชหน้า';
    const tick=async()=>{if(!stream)return;
      if(v.videoWidth&&!busy){busy=1;let t='';
        try{if(det){const r=await det.detect(v);if(r[0])t=r[0].rawValue}
          if(!t&&window.jsQR){const k=Math.min(1,640/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;x.drawImage(v,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(r)t=r.data}}catch(e){}
        if(t&&t!==bad){if(await gotQR(t)){busy=0;return}bad=t}busy=0}
      raf=requestAnimationFrame(tick)};tick()
  }catch(e){$('sst').textContent='เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง หรือเลือกรูป QR จากเครื่อง'}};
window.scanFile=async i=>{const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=async()=>{let t='';
  try{if(window.BarcodeDetector){const r=await new BarcodeDetector({formats:['qr_code']}).detect(im);if(r[0])t=r[0].rawValue}
    if(!t&&window.jsQR){const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(r)t=r.data}}catch(e){}
  if(!t){$('sst').textContent='อ่าน QR จากรูปนี้ไม่ได้';return}await gotQR(t)};im.src=rd.result};rd.readAsDataURL(f)};

window.addEventListener('unhandledrejection',ev=>{const c=(ev.reason&&(ev.reason.code||ev.reason.message))||'';if(/permission/i.test(c))toast('Firestore rules ไม่อนุญาตการทำรายการนี้')});
init();
</script>
</body>
</html>
