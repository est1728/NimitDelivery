<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<title>ข้อมูลจัดส่ง - Nimit Delivery</title>
<style>
:root{
  --primary:#0c4aa6; --primary-dark:#083570; --primary-light:#e8f0fe;
  --gray:#f5f6f8; --text:#0f172a; --subtext:#64748b;
  --shadow-sm:0 1px 3px rgba(15,23,42,0.05);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial',sans-serif;}
body{background:#fff;min-height:100vh;padding-bottom:100px;}

.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:#fff;z-index:100;}
.back-btn{width:38px;height:38px;border:none;background:var(--gray);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.back-btn svg{width:18px;height:18px;fill:none;stroke:var(--text);stroke-width:2.5;}
.topbar-title{font-size:17px;font-weight:800;color:var(--text);}

.container{padding:20px;}

.section-title{font-size:12px;font-weight:700;color:var(--subtext);text-transform:uppercase;letter-spacing:0.5px;margin:20px 0 10px;}

.input-group{margin-bottom:14px;}
.input-label{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;}
.input{width:100%;height:52px;border:2px solid #e8e8e8;border-radius:14px;padding:0 16px;font-size:15px;outline:none;transition:border 0.2s;background:#fff;}
.input:focus{border-color:var(--primary);}
textarea.input{height:90px;padding:12px 16px;resize:none;line-height:1.5;}

.map-wrapper{position:relative;border-radius:14px;overflow:hidden;border:2px solid #e8e8e8;isolation:isolate;z-index:0;}
#map{height:260px;width:100%;}
.gps-btn{position:absolute;top:10px;right:10px;z-index:999;width:44px;height:44px;border-radius:50%;background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.gps-btn svg{width:22px;height:22px;fill:var(--primary);}
.coords-box{margin-top:10px;padding:10px 14px;background:var(--primary-light);border-radius:12px;font-size:13px;color:var(--primary);display:none;font-weight:700;}
.hint{font-size:12px;color:var(--subtext);margin-top:8px;}

.save-bar{position:fixed;bottom:0;left:0;right:0;padding:14px 16px 26px;background:#fff;border-top:1px solid #f0f0f0;}
.save-bar button{width:100%;height:54px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(12,74,166,0.3);}
.save-bar button:disabled{background:#c5cfe8;box-shadow:none;cursor:not-allowed;}
/* แก้บัคแมพซ้อน UI อื่น: Leaflet ตั้งค่า z-index ปุ่มซูม/เลเยอร์สูงมากโดยดีฟอลต์ ทำให้ลอยทับแถบหัวข้อ/ป๊อบอัพที่ z-index ต่ำกว่า */
.leaflet-top, .leaflet-bottom { z-index: 50 !important; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="history.back()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
  <div class="topbar-title">ข้อมูลจัดส่ง</div>
</div>

<div class="container">
  <div class="section-title">ข้อมูลส่วนตัว</div>
  <div class="input-group">
    <div class="input-label">ชื่อ-นามสกุล</div>
    <input class="input" id="name" type="text" placeholder="เช่น คุณนิด" oninput="checkForm()">
  </div>
  <div class="input-group">
    <div class="input-label">รายละเอียดที่อยู่</div>
    <textarea class="input" id="address" placeholder="บ้านเลขที่ / หมู่ / ซอย / จุดสังเกต" oninput="checkForm()"></textarea>
  </div>

  <div class="section-title">ตำแหน่งจัดส่ง</div>
  <div class="map-wrapper">
    <div id="map"></div>
    <button class="gps-btn" onclick="getMyLocation()">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 17.93V18a1 1 0 0 0-2 0v1.93A8 8 0 0 1 4.07 13H6a1 1 0 0 0 0-2H4.07A8 8 0 0 1 11 4.07V6a1 1 0 0 0 2 0V4.07A8 8 0 0 1 19.93 11H18a1 1 0 0 0 0 2h1.93A8 8 0 0 1 13 19.93zM12 9a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></svg>
    </button>
  </div>
  <div class="hint">แตะแผนที่เพื่อปักหมุด หรือกดปุ่มใช้ตำแหน่งปัจจุบัน</div>
  <div class="coords-box" id="coordsBox"><span id="coordsText"></span></div>
</div>

<div class="save-bar">
  <button id="saveBtn" onclick="saveData()" disabled>บันทึกข้อมูล</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, initializeFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyCnBUk0ZKFcwMK0NyYkheux1xPt9bLYhr4",
  authDomain:"nimit-delivery.firebaseapp.com",
  projectId:"nimit-delivery",
  storageBucket:"nimit-delivery.firebasestorage.app",
  messagingSenderId:"233476256130",
  appId:"1:233476256130:web:62ba8f64ad0bf2f92c9f9b"
};
const app = initializeApp(firebaseConfig);
// สำคัญมาก: ดูคำอธิบายเดียวกับใน menu.html — บังคับใช้ long-polling กัน iOS Safari เชื่อมต่อ Firestore
// ค้าง/ล้มเหลวแบบเงียบๆ ซึ่งตรงกับอาการ "กรอกข้อมูลสมัครแล้วเหมือนสำเร็จ แต่ไม่มีลูกค้าใหม่ขึ้นในระบบจริง"
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

const map = L.map('map').setView([13.7563,100.5018],13);
const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19,maxNativeZoom:19});
const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19});
satelliteLayer.addTo(map);
L.control.layers({'ดาวเทียม':satelliteLayer,'แผนที่ถนน':streetLayer}, null, {position:'topleft'}).addTo(map);

// บัค "แผนที่ลอย" ตอนเลื่อนหน้า: Leaflet จำตำแหน่ง container ไว้ตอนสร้างแผนที่ครั้งแรก
// ถ้า layout ขยับหลังจากนั้น (ฟอนต์โหลดเสร็จ, แถบ URL ของมือถือหด/ขยาย) ตัวแผนที่จะเพี้ยนจากกรอบจริง
// ต้องสั่ง invalidateSize() ซ้ำหลังโหลดเสร็จ และตอน resize/orientation เปลี่ยน
setTimeout(()=>map.invalidateSize(),300);
window.addEventListener('load',()=>map.invalidateSize());
window.addEventListener('resize',()=>map.invalidateSize());
window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),300));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) map.invalidateSize(); });

let marker, selectedLat=null, selectedLng=null;

function placeMarker(lat,lng){
  if(marker) map.removeLayer(marker);
  marker=L.marker([lat,lng]).addTo(map);
  map.setView([lat,lng],16);
  selectedLat=lat; selectedLng=lng;
  document.getElementById("coordsText").textContent=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  document.getElementById("coordsBox").style.display="block";
  checkForm();
}

map.on('click',e=>placeMarker(e.latlng.lat,e.latlng.lng));

// ปักหมุดให้อัตโนมัติตอนเข้าหน้านี้ครั้งแรก (ลูกค้าใหม่) ถ้าเครื่องอนุญาตตำแหน่งอยู่แล้ว ไม่ต้องกดปุ่มเองก็ได้
// ถ้าปฏิเสธสิทธิ์/หาตำแหน่งไม่ได้ ก็แค่เงียบไว้ ให้ลูกค้าปักเองหรือกดปุ่ม GPS แทนได้ตามปกติ ไม่รบกวนด้วยข้อความเตือน
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    pos=>placeMarker(pos.coords.latitude,pos.coords.longitude),
    ()=>{},
    {timeout:5000}
  );
}

window.getMyLocation=function(){
  const ua = navigator.userAgent || '';
  const isInAppBrowser = /FBAN|FBAV|FB_IAB|Instagram|Line|MicroMessenger|TikTok/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  if(isInAppBrowser && isIOS){
    alert('ขอตำแหน่งไม่ได้เพราะเปิดผ่านแอปแชท (เช่น LINE/Messenger) บน iPhone ครับ\n\nกรุณากดจุด 3 จุด/ไอคอนมุมขวาบน แล้วเลือก "เปิดใน Safari" ก่อน ถึงจะขอตำแหน่งได้ หรือปักหมุดเองบนแผนที่แทนได้เลยครับ');
    return;
  }
  if(!navigator.geolocation) return;
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  // สำคัญมาก: ตัวเลือก {timeout:...} ที่ส่งให้ getCurrentPosition() เองใช้ไม่ได้ผลตอน iOS standalone ค้าง
  // (บัคที่รู้จักของ iOS ทำให้ callback ทั้งสำเร็จและ error ไม่ถูกเรียกเลยแม้แต่ครั้งเดียว) ต้องตั้ง setTimeout
  // ของเราเองแยกต่างหากไว้ข้างนอก ซึ่งรับประกันว่าจะทำงานแน่นอนไม่ว่า geolocation API จะค้างแค่ไหนก็ตาม
  let settled = false;
  const manualTimeout = setTimeout(()=>{
    if(settled) return;
    settled = true;
    if(isStandalone){
      alert("เข้าถึงตำแหน่งไม่ได้ — เป็นบัคที่รู้จักของ iOS เวลาเปิดผ่านไอคอนหน้าจอโฮม\n\nลองเปิดลิงก์นี้ผ่าน Safari ตรงๆ (ไม่ผ่านไอคอนที่บันทึกไว้) แล้วลองใหม่อีกครั้ง หรือปักหมุดเองบนแผนที่แทนได้เลยครับ");
    } else {
      alert("ค้นหาตำแหน่งนานเกินไป ลองใหม่อีกครั้ง หรือปักหมุดเองบนแผนที่แทนได้ครับ");
    }
  }, 8000);
  navigator.geolocation.getCurrentPosition(
    pos=>{
      if(settled) return;
      settled = true;
      clearTimeout(manualTimeout);
      placeMarker(pos.coords.latitude,pos.coords.longitude);
    },
    (err)=>{
      if(settled) return;
      settled = true;
      clearTimeout(manualTimeout);
      // สำคัญ: แยกข้อความตาม error.code ให้ชัดว่าสาเหตุจริงคืออะไร ไม่ใช้ข้อความเดียวกันหมด
      if(err && err.code === 1){
        alert("เว็บไซต์ไม่ได้รับสิทธิ์เข้าถึงตำแหน่ง — ต้องไปเปิดเองในตั้งค่าเครื่อง (ตั้งค่า > ความเป็นส่วนตัว > บริการหาตำแหน่ง > Safari/เบราว์เซอร์ที่ใช้ > อนุญาต) แล้วลองใหม่ หรือปักหมุดเองบนแผนที่แทนได้เลยครับ");
      } else if(isStandalone){
        alert("เข้าถึงตำแหน่งไม่ได้ — เป็นบัคที่รู้จักของ iOS เวลาเปิดผ่านไอคอนหน้าจอโฮม\n\nลองเปิดลิงก์นี้ผ่าน Safari ตรงๆ (ไม่ผ่านไอคอนที่บันทึกไว้) แล้วลองใหม่อีกครั้ง หรือปักหมุดเองบนแผนที่แทนได้เลยครับ");
      } else {
        alert("ไม่สามารถเข้าถึง GPS ได้ ลองปักหมุดเองบนแผนที่แทนได้ครับ");
      }    },
    {timeout:8000, enableHighAccuracy:true}
  );
}

window.checkForm=function(){
  const name=document.getElementById("name").value.trim();
  const address=document.getElementById("address").value.trim();
  document.getElementById("saveBtn").disabled=!(name&&address&&selectedLat);
  scheduleAutoSave();
}

// บันทึกความคืบหน้าแบบเรียลไทม์ระหว่างกรอกฟอร์ม (debounce กันยิง Firestore ถี่เกินไปตอนพิมพ์เร็วๆ)
// เผื่อลูกค้ากรอกไม่จบ/ปิดแอพไปกลางทาง อย่างน้อยแอดมินจะเห็นข้อมูลเท่าที่กรอกไว้แล้ว ไม่ใช่ต้องรอกด "บันทึกข้อมูล" เท่านั้น
let autoSaveTimer=null;
function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(saveProgress,1000);
}
async function saveProgress(){
  const phone=localStorage.getItem("customerPhone");
  if(!phone) return;
  const name=document.getElementById("name").value.trim();
  const address=document.getElementById("address").value.trim();
  const partial={phone};
  if(name) partial.name=name;
  if(address) partial.address=address;
  if(selectedLat){ partial.lat=selectedLat; partial.lng=selectedLng; }
  if(Object.keys(partial).length<=1) return; // ยังไม่มีอะไรให้บันทึกเพิ่มจากเบอร์โทร
  try{ await setDoc(doc(db,"customers",phone),partial,{merge:true}); }catch(e){}
}

window.saveData=async function(){
  const phone=localStorage.getItem("customerPhone");
  const name=document.getElementById("name").value.trim();
  const address=document.getElementById("address").value.trim();
  // สำคัญ: selectedLat/selectedLng อาจเป็น undefined ได้ถ้าลูกค้ายังไม่เคยปักหมุดเลย — Firestore จะปฏิเสธ
  // การเขียนข้อมูลทั้งก้อนทันทีถ้ามีฟิลด์ไหนเป็น undefined (บัคคลาสเดียวกับที่เจอฝั่ง checkout.html)
  const customerData={phone,name,address,lat:selectedLat||null,lng:selectedLng||null,createdAt:new Date().toISOString(),registered:true};
  try{
    await setDoc(doc(db,"customers",phone),customerData);
    localStorage.setItem("customerData",JSON.stringify(customerData));
    // เติมลง address book ทันที ให้หน้า address.html แสดงเป็นรายการที่อยู่ (ไม่ใช่ฟอร์มเปล่า)
    localStorage.setItem("addresses",JSON.stringify([{name,phone,address,lat:selectedLat||null,lng:selectedLng||null}]));
    localStorage.setItem("defaultAddress","0");
    sessionStorage.removeItem("newCustomer");
    window.location.replace("address.html"); // ลงทะเบียนเสร็จแล้ว ไม่ควรย้อนกลับมาฟอร์มลงทะเบียนที่จบไปแล้ว
  }catch(e){ alert("เกิดข้อผิดพลาด: "+e.message); console.error(e); }
}
</script>
</body>
</html>
