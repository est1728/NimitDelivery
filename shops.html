<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nimit Delivery — ร้านค้าทั้งหมด (v6)</title>
<meta name="theme-color" content="#0B2C63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#071B3D; --blue-800:#0B2C63; --blue-700:#0E3B8C; --blue-600:#1550B8; --blue-500:#2E6FE0;
  --blue-100:#E7EFFC; --blue-50:#F4F8FE;
  --amber-500:#F2A93C; --amber-600:#D98F1E; --amber-100:#FDEEDA;
  --green-600:#12996B; --green-100:#DFF4EC;
  --red-500:#E5484D; --red-100:#FCE7E8;
  --ink-900:#101828; --ink-700:#3A4256; --ink-500:#667085; --ink-300:#9AA2B8;
  --line:#E7EAF2; --bg:#F5F7FC; --white:#FFFFFF;
  --bounce:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{overscroll-behavior-y:contain;}
body{font-family:'IBM Plex Sans Thai','Prompt',Arial,sans-serif;background:var(--bg);color:var(--ink-900);-webkit-font-smoothing:antialiased;}
.disp{font-family:'Prompt',sans-serif;}
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:96px;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--blue-100);}

/* ===== generic press feedback ===== */
.press{transition:transform .12s var(--bounce);}
.press:active{transform:scale(.94);}

/* ===== entrance stagger ===== */
.enter{opacity:0;transform:translateY(16px) scale(.97);animation:enterUp .5s var(--bounce) forwards;}
@keyframes enterUp{to{opacity:1;transform:translateY(0) scale(1);}}

/* ===== pull to refresh ===== */
.ptr{display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;transition:height .2s ease;color:var(--blue-700);}
.ptr.show{height:52px;}
.ptr-spin{width:22px;height:22px;border:2.5px solid var(--blue-100);border-top-color:var(--blue-700);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== sticky compact bar ===== */
.sticky-bar{position:fixed;top:0;left:50%;transform:translate(-50%,-100%);width:100%;max-width:480px;background:var(--white);z-index:300;box-shadow:0 4px 16px rgba(7,27,61,.1);display:flex;align-items:center;gap:10px;padding:10px 14px;transition:transform .28s var(--bounce);}
.sticky-bar.show{transform:translate(-50%,0);}
.sticky-bar .brand-mark{width:26px;height:26px;border-radius:7px;background:var(--blue-900);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.sticky-bar input{flex:1;height:34px;border:none;border-radius:10px;background:var(--bg);padding:0 12px;font-size:12.5px;color:var(--ink-500);cursor:pointer;}
.sticky-cart{position:relative;width:34px;height:34px;border-radius:50%;background:var(--blue-50);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.sticky-cart svg{width:16px;height:16px;fill:var(--blue-700);}

/* ===== TOP BAR ===== */
.tb{background:linear-gradient(160deg,var(--blue-900) 0%,var(--blue-700) 85%);padding:14px 16px 16px;border-radius:0 0 24px 24px;position:relative;overflow:hidden;}
.tb::after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.05);}
.tb-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;position:relative;z-index:1;}
.brand{display:flex;align-items:center;gap:9px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--blue-900);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:float 3.2s ease-in-out infinite;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;}
.brand-mark img{width:100%;height:100%;object-fit:cover;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.brand-name{font-family:'Prompt';font-weight:600;font-size:16.5px;color:var(--white);line-height:1.15;}
.login-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:12px;padding:3px 9px;margin-top:5px;cursor:pointer;}
.login-chip span{font-size:11.5px;font-weight:600;color:var(--white);}
.login-chip svg{width:11px;height:11px;fill:rgba(255,255,255,.75);}
.tb-icons{display:flex;gap:8px;flex-shrink:0;position:relative;z-index:1;}
.icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.13);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;}
.icon-btn svg{width:18px;height:18px;fill:var(--white);}
.cart-bdg{position:absolute;top:-3px;right:-3px;background:var(--red-500);color:var(--white);font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:20px;display:none;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--blue-700);}
.cart-bdg.bump{animation:bump .38s var(--bounce);}
@keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.5);}100%{transform:scale(1);}}
.cart-shake{animation:shake .5s var(--bounce);}
@keyframes shake{0%,100%{transform:rotate(0);}25%{transform:rotate(-14deg);}50%{transform:rotate(10deg);}75%{transform:rotate(-6deg);}}

.srch{position:relative;z-index:1;}
.srch input{width:100%;height:44px;border:none;border-radius:14px;background:var(--white);padding:0 14px 0 42px;font-size:13.5px;outline:none;color:var(--ink-900);cursor:pointer;}
.srch input::placeholder{color:var(--ink-300);}
.srch-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:#94A0B8;stroke-width:2;stroke-linecap:round;pointer-events:none;}

/* ===== SIDEBAR ===== */
.sb-overlay{position:fixed;inset:0;background:rgba(7,27,61,.45);z-index:500;display:none;}
.sb-overlay.show{display:block;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sidebar{position:fixed;top:0;right:-300px;width:284px;height:100%;background:var(--white);z-index:501;transition:right .3s var(--bounce);box-shadow:-6px 0 24px rgba(7,27,61,.18);display:flex;flex-direction:column;}
.sidebar.open{right:0;}
.sb-head{background:linear-gradient(135deg,var(--blue-800),var(--blue-900));padding:22px 18px;color:var(--white);display:flex;justify-content:space-between;align-items:flex-start;}
.sb-head-l{display:flex;align-items:center;gap:11px;}
.sb-logo{width:38px;height:38px;border-radius:11px;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;}
.sb-logo img{width:100%;height:100%;object-fit:cover;}
.sb-name{font-family:'Prompt';font-weight:600;font-size:15px;}
.sb-sub{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px;}
.sb-close{background:rgba(255,255,255,.16);border:none;width:28px;height:28px;border-radius:50%;color:var(--white);font-size:14px;cursor:pointer;flex-shrink:0;}
.sb-body{flex:1;padding:6px 0;overflow-y:auto;}
.sb-item{display:flex;align-items:center;gap:13px;padding:14px 18px;border:none;background:none;width:100%;text-align:left;cursor:pointer;border-bottom:1px solid var(--line);}
.sb-item svg{width:19px;height:19px;fill:var(--ink-500);flex-shrink:0;}
.sb-item-t{font-size:13.5px;font-weight:600;color:var(--ink-900);}
.sb-item-s{font-size:11px;color:var(--ink-500);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-item-text{flex:1;min-width:0;}
.sb-arrow{width:14px;height:14px;fill:var(--ink-300);flex-shrink:0;transition:transform .2s;}
.sw-inline{display:none;background:var(--blue-50);padding:4px 18px 10px;}
.sw-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.sw-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
.sw-del{border:none;background:var(--red-100);color:var(--red-500);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:12px;flex-shrink:0;}

/* ===== ADS ===== */
.ads{background:var(--white);margin-top:14px;}
.ads-outer{overflow:hidden;width:100%;}
.ads-track{display:flex;}
.ad-slide{width:100%;flex:0 0 100%;position:relative;cursor:pointer;}
.ad-ph{width:100%;aspect-ratio:2.1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ad-ph span{animation:float2 3s ease-in-out infinite;display:inline-block;}
@keyframes float2{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-6px) rotate(-4deg);}}
.ad-cap{position:relative;margin-top:-46px;padding:0 16px 14px;background:linear-gradient(transparent,rgba(7,27,61,.75));color:var(--white);font-family:'Prompt';font-weight:600;font-size:15px;}
.ad-cap span{display:block;font-family:'IBM Plex Sans Thai';font-weight:400;font-size:11px;color:rgba(255,255,255,.82);margin-top:2px;}
.ads-dots{display:flex;justify-content:center;gap:5px;padding:9px 0;}
.ads-dots .d{width:5px;height:5px;border-radius:3px;background:var(--line);cursor:pointer;transition:all .3s var(--bounce);}
.ads-dots .d.on{background:var(--blue-600);width:16px;}

/* ===== ACTIVE ORDER ===== */
.ao{margin:14px 16px 0;background:linear-gradient(120deg,var(--blue-700),var(--blue-900));border-radius:18px;padding:14px 16px;cursor:pointer;box-shadow:0 8px 20px rgba(11,44,99,.25);display:none;position:relative;overflow:hidden;}
.ao-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.ao-id{font-family:'Prompt';font-size:13.5px;font-weight:600;color:var(--white);display:flex;align-items:center;gap:6px;}
.ao-live{width:7px;height:7px;border-radius:50%;background:#4ADE80;position:relative;}
.ao-live::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid #4ADE80;animation:pulse2 1.6s ease-out infinite;}
@keyframes pulse2{0%{opacity:.8;transform:scale(.6);}100%{opacity:0;transform:scale(2.1);}}
.ao-badge{font-size:10px;font-weight:700;background:rgba(255,255,255,.18);color:var(--white);padding:3px 9px;border-radius:20px;}
.ao-shop{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.85);margin-bottom:9px;}
.ao-st{font-weight:700;color:var(--white);}
.ao-bar{display:flex;gap:4px;margin-bottom:2px;}
.ao-seg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden;}
.ao-seg i{display:block;height:100%;width:0%;background:var(--amber-500);border-radius:2px;transition:width .9s var(--bounce);}
.ao-seg.d i{width:100%;background:var(--amber-500);}
.ao-seg.c i{width:100%;background:var(--white);}
.ao-rider{position:absolute;right:14px;bottom:12px;font-size:20px;animation:ride 1.4s ease-in-out infinite;}
@keyframes ride{0%,100%{transform:translateX(0);}50%{transform:translateX(-4px);}}

/* ===== REWARDS (new) ===== */
.rw{margin:14px 16px 0;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.rw-ic{width:40px;height:40px;border-radius:12px;background:var(--amber-100);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;animation:float 2.6s ease-in-out infinite;}
.rw-body{flex:1;min-width:0;}
.rw-top{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px;}
.rw-top b{font-family:'Prompt';font-size:12.5px;color:var(--ink-900);font-weight:600;}
.rw-top span{color:var(--ink-500);}
.rw-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden;}
.rw-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--amber-500),var(--amber-600));border-radius:4px;transition:width 1s var(--bounce) .2s;}

/* ===== SECTION HEAD ===== */
.sec{margin-top:20px;}
.sec-hd{padding:0 16px 11px;display:flex;align-items:center;justify-content:space-between;}
.sec-t{font-family:'Prompt';font-size:15.5px;font-weight:600;color:var(--ink-900);display:flex;align-items:center;gap:8px;}
.sec-t::before{content:'';width:4px;height:16px;background:var(--blue-600);border-radius:2px;}
.sec-link{font-size:11.5px;color:var(--blue-600);font-weight:600;cursor:pointer;}

/* ===== FLASH SALE (new) ===== */
.flash-t{color:var(--red-500);}
.flash-t::before{background:var(--red-500);}
.flash-timer{display:flex;align-items:center;gap:5px;background:var(--ink-900);color:var(--white);border-radius:20px;padding:4px 10px 4px 8px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}
.flash-timer .fdot{width:6px;height:6px;border-radius:50%;background:var(--red-500);animation:pulse2b 1s ease-in-out infinite;}
@keyframes pulse2b{0%,100%{opacity:1;}50%{opacity:.25;}}
.flash-row{display:flex;gap:11px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;}
.flash-row::-webkit-scrollbar{display:none;}
.flash-card{flex-shrink:0;width:116px;background:var(--white);border-radius:16px;border:1px solid var(--line);overflow:hidden;cursor:pointer;}
.flash-thumb{height:78px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;}
.flash-off{position:absolute;top:6px;left:6px;background:var(--red-500);color:var(--white);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;}
.flash-info{padding:8px 9px 10px;}
.flash-name{font-size:11px;font-weight:600;color:var(--ink-900);line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.flash-price .now{font-size:12.5px;font-weight:700;color:var(--red-500);}
.flash-price .was{font-size:10px;color:var(--ink-300);text-decoration:line-through;margin-left:4px;}

/* ===== POPULAR ===== */
.pop-row{display:flex;gap:11px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;}
.pop-row::-webkit-scrollbar{display:none;}
.pop-card{background:var(--white);border-radius:14px;width:150px;flex-shrink:0;overflow:hidden;border:1px solid var(--line);cursor:pointer;}
.pop-img{width:100%;height:96px;display:flex;align-items:center;justify-content:center;font-size:32px;}
.pop-body{padding:8px 10px 10px;}
.pop-name{font-size:12.5px;font-weight:600;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pop-meta{font-size:10.5px;color:var(--ink-500);margin-top:3px;}
.pop-rank{position:absolute;margin:6px;background:var(--blue-900);color:#fff;font-size:10px;font-weight:700;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* ===== CATEGORY BUTTONS ===== */
.cat-row{display:flex;gap:15px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;}
.cat-row::-webkit-scrollbar{display:none;}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:60px;cursor:pointer;}
.cat-ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--white);transition:all .3s var(--bounce);}
.cat-item.active .cat-ic{transform:scale(1.08);box-shadow:0 6px 14px rgba(14,59,140,.28);}
.cat-item:active .cat-ic{transform:scale(.9);}
.cat-ic svg{width:23px;height:23px;transition:fill .2s;}
.cat-label{font-size:10.5px;font-weight:600;color:var(--ink-700);text-align:center;line-height:1.25;}

/* ===== FILTER CHIPS ===== */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.f-chip{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:11.5px;font-weight:600;color:var(--ink-700);cursor:pointer;white-space:nowrap;transition:all .18s var(--bounce);}
.f-chip svg{width:13px;height:13px;fill:var(--ink-500);}
.f-chip.active{background:var(--blue-700);border-color:var(--blue-700);color:var(--white);transform:scale(1.03);}
.f-chip.active svg{fill:var(--white);}

/* ===== SHOP CARDS ===== */
.shops-cont{padding:0 16px;display:flex;flex-direction:column;gap:13px;}
.sc{background:var(--blue-50);border-radius:20px;cursor:pointer;border:1px solid var(--line);overflow:hidden;transition:transform .18s var(--bounce),box-shadow .18s ease;}
.sc:active{transform:scale(.96);}
.sc:active{transform:scale(.98);}
.sc.closed{opacity:.6;filter:grayscale(70%);pointer-events:none;}
.sc-banner{width:100%;height:104px;position:relative;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;}
.sc-banner span{transition:transform .35s ease;}
.sc:hover .sc-banner span{transform:scale(1.08) rotate(-3deg);}
.sc-badges{position:absolute;top:9px;left:9px;display:flex;gap:6px;}
.sc-badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:8px;color:var(--white);display:flex;align-items:center;gap:3px;}
.sc-badge.pop{background:var(--amber-600);position:relative;}
.sc-badge.pop::after{content:'';position:absolute;inset:-3px;border-radius:11px;border:1.5px solid var(--amber-500);animation:pulse 2.2s ease-in-out infinite;}
.sc-badge.top{background:var(--blue-700);}
.sc-badge.new{background:var(--green-600);}
.sc-badge.fast{background:#1291A6;}
.sc-badge.promo{background:var(--red-500);}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1);}50%{opacity:0;transform:scale(1.14);}}
.sc-open,.sc-close{position:absolute;top:9px;right:9px;padding:4px 10px;border-radius:8px;font-size:10.5px;font-weight:700;}
.sc-open{background:var(--green-100);color:var(--green-600);}
.sc-close{background:var(--red-100);color:var(--red-500);}
.qadd{position:absolute;right:9px;bottom:9px;width:30px;height:30px;border-radius:50%;background:var(--white);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(16,24,40,.22);z-index:3;}
.qadd svg{width:15px;height:15px;fill:var(--blue-700);}
.qadd:active{transform:scale(.85);}
.sc-body{padding:0 14px 14px;position:relative;background:var(--blue-50);}
.sc-top{display:flex;align-items:flex-end;gap:12px;margin-bottom:9px;}
.sc-avatar{width:64px;height:64px;border-radius:16px;background:var(--blue-50);flex-shrink:0;border:3px solid var(--white);box-shadow:0 2px 10px rgba(16,24,40,.14);margin-top:-28px;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;font-size:26px;}
.sc-info{flex:1;min-width:0;padding-bottom:2px;display:flex;justify-content:space-between;gap:6px;}
.sc-name{font-family:'Prompt';font-size:14.5px;font-weight:600;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-desc{font-size:11.5px;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.fav-btn{border:none;background:none;cursor:pointer;flex-shrink:0;padding:2px;position:relative;}
.fav-btn svg{width:19px;height:19px;fill:none;stroke:var(--ink-300);stroke-width:2;transition:all .3s var(--bounce);}
.fav-btn.on svg{fill:var(--red-500);stroke:var(--red-500);animation:heartPop .4s var(--bounce);}
@keyframes heartPop{0%{transform:scale(1);}45%{transform:scale(1.5);}100%{transform:scale(1);}}
.burst{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;background:var(--red-500);pointer-events:none;}
.sc-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:3px;}
.mi{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-500);}
.mi svg{width:13px;height:13px;fill:var(--ink-500);}
.mi.star{color:var(--amber-600);font-weight:700;}
.mi.star svg{fill:var(--amber-600);}
.mi.loyalty{color:#B4530F;}
.mi.close-reason{color:var(--red-500);}

/* ===== SPONSORED CARD ===== */
.ad-card{background:linear-gradient(100deg,var(--blue-50),var(--white));border:1px dashed var(--blue-100);border-radius:18px;padding:13px;display:flex;align-items:center;gap:12px;}
.ad-thumb{width:48px;height:48px;border-radius:12px;background:var(--blue-700);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:21px;}
.ad-copy{flex:1;min-width:0;}
.ad-sponsor{font-size:9.5px;color:var(--ink-300);font-weight:700;margin-bottom:2px;}
.ad-title{font-family:'Prompt';font-weight:600;font-size:12.5px;color:var(--ink-900);}
.ad-sub{font-size:10.5px;color:var(--ink-500);margin-top:1px;}
.ad-cta{background:var(--blue-700);color:var(--white);font-size:10.5px;font-weight:700;padding:7px 11px;border-radius:20px;border:none;cursor:pointer;flex-shrink:0;}

.closed-lbl{font-size:11.5px;font-weight:700;color:var(--ink-300);padding:18px 16px 9px;}
.lt{text-align:center;padding:44px 20px;color:var(--ink-500);font-size:13.5px;}

/* ===== SKELETONS ===== */
.skel{background:linear-gradient(100deg,#EDF0F7 25%,#F7F9FC 37%,#EDF0F7 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:20px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
.skel-card{height:220px;margin:0 16px;}
.skel-wrap{padding:0;display:flex;flex-direction:column;gap:13px;}

/* ===== FLY TO CART DOT ===== */
.fly{position:fixed;width:26px;height:26px;border-radius:50%;background:var(--amber-500);z-index:800;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.25);pointer-events:none;}

/* ===== BOTTOM NAV ===== */
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;max-width:480px;width:100%;background:var(--white);display:flex;border-top:1px solid var(--line);z-index:199;padding-bottom:2px;}
.bnav-item{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;position:relative;}
.bnav-item svg{width:21px;height:21px;fill:var(--ink-300);transition:transform .3s var(--bounce);}
.bnav-item span{font-size:10px;font-weight:600;color:var(--ink-300);}
.bnav-item.active svg{fill:var(--blue-700);}
.bnav-item.active span{color:var(--blue-700);}
.bnav-item.disabled{opacity:.5;}
.bnav-item.bounced svg{animation:navBounce .45s var(--bounce);}
@keyframes navBounce{0%{transform:translateY(0);}40%{transform:translateY(-6px);}100%{transform:translateY(0);}}

/* ===== TOAST ===== */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px) scale(.9);background:var(--ink-900);color:var(--white);font-size:12.5px;font-weight:500;padding:10px 16px;border-radius:12px;z-index:900;opacity:0;transition:all .32s var(--bounce);pointer-events:none;max-width:88%;text-align:center;display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
.toast .tick{width:16px;height:16px;border-radius:50%;background:var(--green-600);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.toast .tick svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>

// ระยะทางระหว่างพิกัด (สูตรเดียวกับ shops.html จริง)
function calcDist(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toastEl');
  el.innerHTML='<span class="tick"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>'+msg;

/* ===================== PULL TO REFRESH ===================== */
(function(){
  let startY=0, pulling=false, dist=0;
  document.addEventListener('touchstart',e=>{
    if(window.scrollY<=0){ startY=e.touches[0].clientY; pulling=true; }
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling) return;
    dist=e.touches[0].clientY-startY;
    if(dist>0 && window.scrollY<=0){
      document.getElementById('ptr').classList.toggle('show', dist>50);
    }
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(pulling && dist>50){
      toast('กำลังอัปเดตร้านค้า...');
      setTimeout(()=>{
        document.getElementById('ptr').classList.remove('show');
        renderShops();
        toast('อัปเดตร้านค้าล่าสุดแล้ว');
      },700);
    } else {
      document.getElementById('ptr').classList.remove('show');
    }
    pulling=false; dist=0;
  });
})();

/* ===================== ADS ===================== */
let curAd=0,adTimer=null;
async function loadAds(){
  try{
    const snap=await getDocs(collection(db,'ads'));
    ADS=[]; snap.forEach(d=>ADS.push({id:d.id,...d.data()}));
  }catch(e){ ADS=[]; }
  if(!ADS.length){ $('adsEl').style.display='none'; return; }
  $('adsEl').style.display='block';
  const track=document.getElementById('adsTrack');
  track.innerHTML=ADS.map(a=>{
    const isVid=a.type==='video'&&a.videoUrl;
    const media=isVid
      ? `<video src="${esc(a.videoUrl)}" class="ad-ph" style="object-fit:cover" autoplay muted loop playsinline></video>`
      : (a.imgUrl?`<img src="${esc(a.imgUrl)}" class="ad-ph" style="object-fit:cover">`:`<div class="ad-ph" style="background:var(--blue-50)"></div>`);
    const cap=a.caption?`<div class="ad-cap">${esc(a.caption)}</div>`:'';
    return `<div class="ad-slide" onclick="window.openAd('${a.shopId||''}','${(a.shopName||'').replace(/'/g,"\\'")}','${(a.linkUrl||'').replace(/'/g,"\\'")}')">${media}${cap}</div>`;
  }).join('');
  document.getElementById('adsDots').innerHTML=ADS.map((_,i)=>`<div class="d${i===0?' on':''}" onclick="event.stopPropagation();goAd(${i})"></div>`).join('');
  startAds();
}
// โฆษณาผูกกับร้าน (shopId) หรือลิงก์เว็บนอก (linkUrl) — ตั้งค่าได้จาก admin.html
window.openAd=function(shopId,shopName,linkUrl){
  if(linkUrl){ window.open(linkUrl,'_blank'); return; }
  if(shopId) pick(shopId,shopName);
};
function goAd(i){
  curAd=i;
  const ow=document.getElementById('adsOuter').clientWidth;
  const track=document.getElementById('adsTrack');
  track.style.transition='transform .45s var(--bounce)';
  track.style.transform=`translateX(${-(i*ow)}px)`;
  document.querySelectorAll('.ads-dots .d').forEach((d,j)=>d.classList.toggle('on',j===i));
}
function startAds(){
  if(adTimer) clearInterval(adTimer);
  if(ADS.length>1) adTimer=setInterval(()=>goAd((curAd+1)%ADS.length),4500);
}

/* ===================== ACTIVE ORDER ===================== */
// สถานะเดียวกับ track.html จริง (pending→accepted→picking→arrived→delivering→done)
const SS=['pending','accepted','picking','arrived','delivering'];
const STATUS_LABEL={pending:'รอรับออเดอร์',accepted:'รับงานแล้ว',picking:'ไรเดอร์กำลังไปร้าน',arrived:'ถึงร้านแล้ว',delivering:'ไรเดอร์กำลังส่งมาหาคุณ'};
async function renderActiveOrder(){
  const phone=JSON.parse(localStorage.getItem('customerData')||'{}').phone || localStorage.getItem('customerPhone');
  if(!phone){ $('aoEl').style.display='none'; return; }
  try{
    const q=query(collection(db,'orders'), where('customer.phone','==',phone));
    const snap=await getDocs(q);
    let active=null;
    snap.forEach(d=>{
      const o={docId:d.id,...d.data()};
      if(SS.includes(o.status)){
        if(!active || (o.createdAt?.toDate?.()||0) > (active.createdAt?.toDate?.()||0)) active=o;
      }
    });
    if(!active){ $('aoEl').style.display='none'; return; }
    const idx=SS.indexOf(active.status);
    $('aoEl').style.display='block';
    $('aoEl').setAttribute('onclick',`location.href='track.html?orderId=${active.docId}'`);
    $('aoShop').textContent=active.shopName||'';
    $('aoSt').textContent=STATUS_LABEL[active.status]||active.status;
    $('aoBar').innerHTML=SS.map((_,i)=>`<div class="ao-seg${i<idx?' d':i===idx?' c':''}"><i></i></div>`).join('');
  }catch(e){ $('aoEl').style.display='none'; }
}

/* ===================== FLASH SALE (ดีลลับนับถอยหลัง) — ข้อมูลจริงจาก collection flashDeals ===================== */
// แอดมินตั้งดีล+เวลาหมดเขตได้จาก admin.html > ดีลลับนับถอยหลัง ตัวนับถอยหลังใช้เวลาของดีลที่ใกล้หมดเขตที่สุด
let flashDeals=[], flashDeadline=null, flashTimerHandle=null;
async function renderFlash(){
  try{
    const snap=await getDocs(collection(db,'flashDeals'));
    const now=Date.now();
    flashDeals=[]; snap.forEach(d=>{ const v={id:d.id,...d.data()}; if(v.endAt>now) flashDeals.push(v); });
  }catch(e){ flashDeals=[]; }
  if(!flashDeals.length){ $('flashSec').style.display='none'; if(flashTimerHandle) clearInterval(flashTimerHandle); return; }
  flashDeals.sort((a,b)=>a.endAt-b.endAt);
  flashDeadline=flashDeals[0].endAt;
  $('flashSec').style.display='block';
  document.getElementById('flashRow').innerHTML=flashDeals.map(f=>{
    const off=Math.round((1-f.dealPrice/f.originalPrice)*100);
    const thumb=f.imgUrl?`<img src="${esc(f.imgUrl)}" style="width:100%;height:100%;object-fit:cover">`:'';
    return `<div class="flash-card press" onclick="${f.shopId?`pick('${f.shopId}','${(f.shopName||'').replace(/'/g,"\\'")}')`:''}">
      <div class="flash-thumb" style="background:var(--blue-50)">${thumb}<div class="flash-off">-${off}%</div></div>
      <div class="flash-info"><div class="flash-name">${esc(f.itemName)}</div><div class="flash-price"><span class="now">฿${f.dealPrice}</span><span class="was">฿${f.originalPrice}</span></div></div>
    </div>`;
  }).join('');
  if(flashTimerHandle) clearInterval(flashTimerHandle);
  tickFlash();
  flashTimerHandle=setInterval(tickFlash,1000);
}
function tickFlash(){
  let diff=flashDeadline-Date.now();
  if(diff<=0){ renderFlash(); return; } // ดีลตัวที่ใกล้หมดเขตที่สุดหมดอายุแล้ว โหลดใหม่
  const h=String(Math.floor(diff/3600000)).padStart(2,'0');
  const m=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  const s=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  document.getElementById('flashTimer').textContent=`${h}:${m}:${s}`;
}

/* กดปุ่มหมวดหมู่ = ไปตามปลายทางที่ตั้งไว้จากหลังบ้านจริง (categories-admin.html เก็บเป็น destPage)
   ค่าเริ่มต้น category.html จะพาไปดูการ์ดร้าน/เมนูที่แอดมินติดแท็กไว้กับปุ่มนี้ */
function catNav(id){
  const b=CATBTNS.find(x=>x.id===id); if(!b) return;
  const dp=b.destPage||'category.html';
  if(/^https?:\/\//i.test(dp)){ location.href=dp; return; }
  const sep=dp.includes('?')?'&':'?';
  location.href=dp+sep+'id='+encodeURIComponent(b.id)+'&name='+encodeURIComponent(b.name||'');
}

/* ===================== POPULAR ===================== */
function shopScore(s){
  const rating=Math.min(s.rating||0,5)/5;
  const orders=Math.min(s.orderCount||0,500)/500;
  const reviews=Math.min(s.ratingCount||0,100)/100;
  return rating*.4+orders*.4+reviews*.2;
}
function renderPop(){
  const pop=[...SHOPS].filter(s=>s.isOpen).sort((a,b)=>shopScore(b)-shopScore(a)).slice(0,5);
  document.getElementById('popRow').innerHTML=pop.map((s,i)=>{
    const img=s.bannerUrl?`<img src="${esc(s.bannerUrl)}" style="width:100%;height:100%;object-fit:cover">`:'';
    return `<div class="pop-card press" onclick="pick('${s.id}','${(s.name||'').replace(/'/g,"\\'")}')">
      <div class="pop-img" style="position:relative">${img}</div>
      <div class="pop-body"><div class="pop-name">${esc(s.name)}</div><div class="pop-meta">⭐ ${(parseFloat(s.rating)||0).toFixed(1)} · ${esc(s.deliveryTime||'20-30')} นาที${s._dist!=null?' · '+(s._dist<1?Math.round(s._dist*1000)+'m':s._dist.toFixed(2)+'km'):''}</div></div>
    </div>`;
  }).join('');
  applyStagger('#popRow','.pop-card');
}

/* ===================== SHOP BADGE ===================== */
function isPopular(s){ return s.rating>=4.5 && s.ratingCount>=50 && s.orderCount>=200; }
function shopBadge(s){
  if(isPopular(s)) return 'pop';
  if(s.rating>=4.5 && s.ratingCount>=3) return 'top';
  if(s.isNew) return 'new';
  if(parseInt(s.deliveryTime)<=15) return 'fast';
  if(s.promo) return 'promo';
  return null;
}
const BADGE_LABEL={pop:'ยอดนิยม',top:'คะแนนสูงสุด',new:'เปิดใหม่',fast:'ส่งไว',promo:'โปรโมชัน'};

/* ===================== SHOP CARD ===================== */
// เปิด/ปิดร้านจริง ต้องดูตารางเวลา/วันที่ปิดพิเศษด้วย ไม่ใช่แค่ธง isOpen ตรงๆ (เหมือน shops.html จริง)
function effectiveOpen(s){
  if(Array.isArray(s.closedDates) && s.closedDates.includes(new Date().toISOString().slice(0,10))) return false;
  if(s.isOpen===false){
    if(s.closeUntil){ if(Date.now()<s.closeUntil) return false; } else return false;
  }
  if(!s.autoSchedule) return true;
  const days=Array.isArray(s.openDays)&&s.openDays.length?s.openDays:[0,1,2,3,4,5,6];
  if(!days.includes(new Date().getDay())) return false;
  return true;
}
// ร้านโปรด — เก็บไว้ในเครื่อง (localStorage) เพราะยังไม่มี collection รองรับร้านโปรดต่อลูกค้าจริง
let favSet=new Set(JSON.parse(localStorage.getItem('favoriteShops')||'[]'));
function distTxt(s){ return s._dist!=null?(s._dist<1?Math.round(s._dist*1000)+'m':s._dist.toFixed(2)+'km'):''; }
function card(s){
  const open=effectiveOpen(s);
  const type=shopBadge(s);
  const badgeEl=type?`<div class="sc-badges"><span class="sc-badge ${type}">${BADGE_LABEL[type]}</span></div>`:'';
  const openBadge=open?`<div class="sc-open">เปิด</div>`:`<div class="sc-close">ปิด</div>`;
  const dt=distTxt(s);
  const timeM=`<div class="mi"><svg viewBox="0 0 24 24"><path d="${FILTER_ICONS.clock}"/></svg>${esc(s.deliveryTime||'20-30')} นาที${dt?' · '+dt:''}</div>`;
  const starM=`<div class="mi star" onclick="event.stopPropagation();location.href='reviews.html?type=shop&id=${s.id}&name='+encodeURIComponent('${(s.name||'').replace(/'/g,"\\'")}')"><svg viewBox="0 0 24 24"><path d="${FILTER_ICONS.star}"/></svg>${(parseFloat(s.rating)||0).toFixed(1)}</div>`;
  const loyaltyM=s.loyaltyEnabled?`<div class="mi loyalty"><svg viewBox="0 0 24 24"><path d="${CAT_ICON_PRESETS.tag}"/></svg>สะสมแต้ม</div>`:'';
  const schM=s.schedule?`<div class="mi"><svg viewBox="0 0 24 24"><path d="${FILTER_ICONS.clock}"/></svg>${esc(s.schedule)}</div>`:'';
  const closeM=(!open && s.closeReason)?`<div class="mi close-reason">🔒 ${esc(s.closeReason)}</div>`:'';
  const oc=open?`onclick="pick('${s.id}','${(s.name||'').replace(/'/g,"\\'")}')"`:'';
  const bannerMedia=s.bannerUrl?`<img src="${esc(s.bannerUrl)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">`:'';
  const avatarMedia=s.avatarUrl
    ?`<img src="${esc(s.avatarUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:13px;">`
    :`<svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:var(--blue-700)"><path d="M20 4H4v2l8 5 8-5V4zm0 4.236l-8 5-8-5V20h16V8.236z"/></svg>`;
  return `<div class="sc" ${oc} style="${open?'':'opacity:.6;filter:grayscale(70%);pointer-events:none;'}">
    <div class="sc-banner" style="background:var(--blue-50)">${bannerMedia}${badgeEl}${openBadge}</div>
    <div class="sc-body">
      <div class="sc-top">
        <div class="sc-avatar">${avatarMedia}</div>
        <div class="sc-info">
          <div style="min-width:0;"><div class="sc-name">${esc(s.name)}</div><div class="sc-desc">${esc(s.desc||'')}</div></div>
          <button class="fav-btn ${favSet.has(s.id)?'on':''}" onclick="event.stopPropagation();toggleFav(this,'${s.id}')" aria-label="ร้านโปรด">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
        </div>
      </div>
      <div class="sc-meta">${timeM}${starM}${loyaltyM}</div>
      ${closeM}${schM}
    </div>
  </div>`;
}
function toggleFav(btn,id){
  const willOn=!favSet.has(id);
  if(willOn) favSet.add(id); else favSet.delete(id);
  localStorage.setItem('favoriteShops', JSON.stringify([...favSet]));
  btn.classList.toggle('on',willOn);
  if(willOn) burstHeart(btn);
}
function burstHeart(btn){
  const rect=btn.getBoundingClientRect();
  for(let i=0;i<6;i++){
    const p=document.createElement('div');
    p.className='burst';
    p.style.left=(rect.left+rect.width/2)+'px';
    p.style.top=(rect.top+rect.height/2)+'px';
    p.style.position='fixed';
    document.body.appendChild(p);
    const ang=(i/6)*Math.PI*2, dist=24;
    p.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(${Math.cos(ang)*dist-50}%,${Math.sin(ang)*dist-50}%) scale(0)`,opacity:0}
    ],{duration:480,easing:'cubic-bezier(.34,1.56,.64,1)'});
    setTimeout(()=>p.remove(),480);
  }
}

function applyStagger(containerSel,itemSel){
  document.querySelectorAll(containerSel+' '+itemSel).forEach((el,i)=>{
    el.classList.add('enter');
    el.style.animationDelay=(i*55)+'ms';
  });
}

// ตัวกรอง — ทำงานจริงกับรายการร้านแล้ว (เดิมเป็นแค่ปุ่มไม่มีผลอะไร)
function applyFilters(list){
  let out=[...list];
  if(activeFilters.has('open')) out=out.filter(s=>effectiveOpen(s));
  if(activeFilters.has('rating')) out.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(activeFilters.has('near')) out.sort((a,b)=>(a._dist??999)-(b._dist??999));
  else out.sort((a,b)=>shopScore(b)-shopScore(a)); // 'แนะนำ' ค่าเริ่มต้น
  return out;
}
function renderShops(){
  const filtered=applyFilters(SHOPS);
  const open=filtered.filter(s=>effectiveOpen(s)), closed=filtered.filter(s=>!effectiveOpen(s));
  document.getElementById('shopsHd').textContent=activeFilters.size===1&&activeFilters.has('rec')?'ร้านทั้งหมด':`ร้านทั้งหมด (${filtered.length})`;
  document.getElementById('shopsEl').innerHTML=
    `<div class="shops-cont">${open.map(card).join('')}</div>`
    +(closed.length?`<div class="closed-lbl">ร้านที่ปิดอยู่ตอนนี้</div><div class="shops-cont">${closed.map(card).join('')}</div>`:'');
  applyStagger('#shopsEl','.sc');
}

/* ===================== SKELETON LOADING ===================== */
function renderSkeleton(){
  document.getElementById('popRow').innerHTML=Array(3).fill('<div class="skel" style="width:150px;height:150px;flex-shrink:0;border-radius:14px;"></div>').join('');
  document.getElementById('shopsEl').innerHTML='<div class="skel-wrap">'+Array(3).fill('<div class="skel skel-card"></div>').join('')+'</div>';
}

/* ===================== ร้านค้าจริงจาก Firestore ===================== */
async function loadShopsData(){
  try{
    const snap=await getDocs(collection(db,'shops'));
    SHOPS=[]; snap.forEach(d=>SHOPS.push({id:d.id,...d.data()}));
  }catch(e){ SHOPS=[]; }
  renderPop();
  renderShops();
  navigator.geolocation?.getCurrentPosition(p=>{
    const userLat=p.coords.latitude, userLng=p.coords.longitude;
    SHOPS.forEach(s=>{ if(s.lat&&s.lng) s._dist=calcDist(userLat,userLng,s.lat,s.lng); });
    renderPop();
    renderShops();
  });
}

/* ===================== นำทางไปหน้าเมนูร้าน ===================== */
function pick(id,name){
  if(!id) return;
  localStorage.setItem('selectedShopId',id);
  localStorage.setItem('selectedShopName',name||'');
  location.href='menu.html?id='+encodeURIComponent(id);
}

/* ===================== CART BADGE (ข้อมูลจริงจาก localStorage cart) ===================== */
function updCart(){
  let cart={}; try{ cart=JSON.parse(localStorage.getItem('cart')||'{}'); }catch(e){}
  let count=0;
  Object.values(cart).forEach(shopCart=>(shopCart.items||[]).forEach(it=>count+=it.qty||1));
  ['cartBdg','cartBdgSticky'].forEach(id=>{
    const b=document.getElementById(id);
    b.textContent=count; b.style.display=count?'flex':'none';
  });
}
