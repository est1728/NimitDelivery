<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เข้าสู่ระบบ - Nimit Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f6bf0;--blue2:#1b55d1;--navy:#0a2a6b;--page:#f4f8ff;--text:#0e1f45;--muted:#6b7ea6;--err:#e5384f}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--text)}
.app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--page)}

.hero{position:relative;isolation:isolate;height:236px;flex:none;color:#fff;overflow:hidden}
.sc{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky{z-index:0}.cloud{position:absolute;z-index:1;will-change:transform;animation:cdrift 20s ease-in-out infinite alternate}
.c1{left:6%;top:50px}.c2{left:68%;top:22px;animation-duration:26s;animation-direction:alternate-reverse}
@keyframes cdrift{from{transform:translateX(-16px)}to{transform:translateX(20px)}}
.layer{position:absolute;inset:0;pointer-events:none}
.far{z-index:2;opacity:.6}.mid{z-index:3}.planet{z-index:4}.ground{z-index:5}
.it{position:absolute;left:50%;display:none;will-change:transform;backface-visibility:hidden}
.it svg{display:block;overflow:visible}
.f{background:#a9cdff}
.dash{width:38px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.85)}
.veil{position:absolute;z-index:6;left:0;right:0;top:0;height:80px;background:linear-gradient(180deg,rgba(10,42,107,.35),rgba(10,42,107,0));pointer-events:none}


.brand{position:absolute;z-index:8;left:20px;top:max(env(safe-area-inset-top,0px),16px);display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;text-shadow:0 2px 8px rgba(8,36,120,.4)}
.brand i{width:36px;height:36px;border-radius:12px;background:linear-gradient(180deg,#fff,#e3eeff);display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(8,36,120,.55)}

/* rider stays centred and bounces; the world does the moving */
.rider{position:absolute;z-index:7;left:calc(50% - 36px);bottom:54px;width:73px;height:90px;pointer-events:none}
.rider.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.bob{position:absolute;inset:0;transform-origin:50% 100%;animation:bob .9s ease-in-out infinite}
.bob img{position:absolute;left:0;bottom:0;height:90px;width:auto;filter:drop-shadow(0 3px 3px rgba(5,20,60,.3))}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-2px) rotate(-.8deg)}
  50%{transform:translateY(-.5px) rotate(0)}
  75%{transform:translateY(-3px) rotate(.7deg)}
}
.rshadow{position:absolute;left:3px;right:-2px;bottom:-3px;height:8px;border-radius:50%;background:radial-gradient(closest-side,rgba(5,20,60,.55),rgba(5,20,60,0));animation:sh .9s ease-in-out infinite}
@keyframes sh{25%,75%{transform:scaleX(.93);opacity:.8}50%{transform:scaleX(.98)}}
.puff{position:absolute;left:54px;bottom:5px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(2px);opacity:0;animation:puff 1s ease-out infinite}
.puff:nth-of-type(2){animation-delay:.33s}.puff:nth-of-type(3){animation-delay:.66s}
@keyframes puff{0%{opacity:.6;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(24px,-6px) scale(1.6)}}

.sheet{position:relative;z-index:3;flex:1 0 auto;margin-top:-30px;background:linear-gradient(180deg,#fff 0%,#f6f9ff 100%);
  border-radius:34px 34px 0 0;padding:26px 22px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -14px 34px -6px rgba(8,36,120,.38),0 -1px 0 rgba(255,255,255,.8) inset;display:flex;flex-direction:column}
h1{margin:0;text-align:center;font-size:25px;font-weight:700;color:var(--navy)}
.sub{margin:4px 0 12px;text-align:center;color:var(--muted);font-size:14.5px}
.field{margin-bottom:13px}
.box{position:relative}
.tile{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:11px;background:#e3eeff;display:grid;place-items:center;transition:background .15s;pointer-events:none}
.tile svg{stroke:#2a6fe0;transition:stroke .15s}
.box:focus-within .tile{background:linear-gradient(180deg,#3a86ff,#1f6bf0);box-shadow:0 6px 12px -4px rgba(31,107,240,.6)}
.box:focus-within .tile svg{stroke:#fff}
input{width:100%;height:54px;border-radius:16px;border:1.5px solid #e1eafa;background:#f1f6ff;color:var(--text);font:inherit;font-size:17px;padding:0 14px 0 54px;outline:none;
  box-shadow:inset 0 2px 5px rgba(20,60,160,.07);transition:border-color .15s,box-shadow .15s,background .15s}
input::placeholder{color:#8da0c6}
input:focus{background:#fff;border-color:#8db8ff;box-shadow:0 0 0 4px rgba(31,107,240,.14),0 10px 20px -12px rgba(31,107,240,.5)}
input.bad{border-color:var(--err);background:#fff}
.msg{min-height:18px;margin:-5px 4px 6px;font-size:13px;color:var(--err)}
button{position:relative;overflow:hidden;width:100%;height:52px;border:0;border-radius:14px;cursor:pointer;color:#fff;font:inherit;font-size:16.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#3f8dff,#1f6bf0);box-shadow:0 3px 0 #1747ad,0 10px 16px -8px rgba(31,107,240,.5);transition:transform .12s,box-shadow .12s,filter .15s}
button:hover{filter:brightness(1.05)}
button:active{transform:translateY(3px);box-shadow:0 0 0 #1747ad,0 4px 8px -6px rgba(31,107,240,.5)}
button:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
button[disabled]{opacity:.8;cursor:default}
[hidden]{display:none!important}
.dots{display:flex;justify-content:center;gap:6px;margin:0 0 12px}
.dots i{width:7px;height:7px;border-radius:99px;background:#cfdcf5;transition:width .35s cubic-bezier(.3,1.5,.5,1),background .2s}
.dots i.on{width:22px;background:var(--blue)}
.who{height:28px;display:flex;justify-content:center;align-items:center;margin:0 0 16px}
.back{width:auto;height:auto;padding:3px 10px 3px 6px;border-radius:99px;background:#e8f0ff;color:var(--blue2);box-shadow:none;font-size:13.5px;font-weight:600;gap:2px;transition:opacity .2s,visibility .2s}
.back:hover{filter:none;background:#dce8ff}
.back:active{transform:none;box-shadow:none;background:#cfe0ff}
.back.hide{opacity:0;visibility:hidden}
.stage{display:grid}
.stage>.field{grid-area:1/1;will-change:transform,opacity}
.stage>.field.off{visibility:hidden}
.note{margin:18px 0 0;text-align:center;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  async get(phone){ const s = await getDoc(doc(db,'customers',phone)); return s.exists() ? s.data() : null; },
  // สมัครแบบ transaction: ถ้ามีคนสมัครเบอร์นี้ไปแล้ว (registered) จะไม่เขียนทับ แต่โยน EXISTS กลับไป
  async register(phone, d){
    const ref = doc(db,'customers',phone);
    await runTransaction(db, async tx => {
      const s = await tx.get(ref), old = s.exists() ? s.data() : {};
      if(old.registered) throw new Error('EXISTS');
      tx.set(ref, {...d, phone, createdAt: old.createdAt || new Date().toISOString(), registered:true, updatedAt: serverTimestamp()}, {merge:true});
    });
  },
  // แก้ที่อยู่ (ไม่แตะชื่อ)
  async patch(phone, d){ await setDoc(doc(db,'customers',phone), {...d, phone, updatedAt: serverTimestamp()}, {merge:true}); }
};
</script>
<script>
const $=id=>document.getElementById(id);

// ---- world: only items near the top are shown; transforms are GPU-composited ----
const world={speed:1,target:1};
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const V=24,STEP=360/39;
const layers=[
  {sel:'.ground',rate:360/70,th:STEP*.3},
  {sel:'.mid',rate:360/172,th:0},
  {sel:'.far',rate:360/450,th:0}
].map(L=>({...L,items:[...document.querySelectorAll(L.sel+' .it')].map(el=>({el,a:+el.dataset.a,on:false}))}));
function upd(L){
  for(const o of L.items){
    const a=((o.a+L.th)%360+540)%360-180;
    if(a>-V&&a<V){ if(!o.on){o.el.style.display='block';o.on=true} o.el.style.transform='rotate('+a.toFixed(2)+'deg)'; }
    else if(o.on){o.el.style.display='none';o.on=false}
  }
}
layers.forEach(upd);
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  world.speed+=(world.target-world.speed)*Math.min(1,dt*3);
  for(const L of layers){L.th=(L.th+L.rate*world.speed*dt)%360;upd(L)}
  requestAnimationFrame(frame);
}
if(!still)requestAnimationFrame(frame);
const nameEl=$('name'),phoneEl=$('phone'),msg=$('msg'),go=$('go'),gotxt=$('gotxt'),rider=$('rider');
function shake(){rider.classList.remove('shake');void rider.offsetWidth;rider.classList.add('shake')}
phoneEl.addEventListener('input',()=>{
  let d=phoneEl.value.replace(/\D/g,'').slice(0,10);
  if(d.length>6)d=d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  else if(d.length>3)d=d.slice(0,3)+'-'+d.slice(3);
  phoneEl.value=d;phoneEl.classList.remove('bad');msg.textContent='';
});
nameEl.addEventListener('input',()=>{nameEl.classList.remove('bad');msg.textContent=''});
let boosted=false;
// idempotent: the old version multiplied playbackRate on every call, so repeated taps made the hero shake faster and faster
function boost(on){if(on===boosted)return;boosted=on;world.target=on?2.4:1;document.getAnimations().forEach(a=>{if(window.CSSAnimation&&a instanceof CSSAnimation)try{a.updatePlaybackRate(on?2.4:1)}catch(e){}})}
const nameF=$('nameF'),phoneF=$('phoneF'),sub=$('sub'),back=$('back'),backtxt=$('backtxt'),dots=[...document.querySelectorAll('.dots i')];
const SUB={1:'เริ่มจากเบอร์โทรศัพท์ของคุณ',2:'ยังไม่เคยใช้เบอร์นี้ บอกชื่อของคุณหน่อย'};
let step=1,busy=false;
// water-drop: the old field falls away as a drop, the new one falls in, lands narrow then splashes wide and settles
const DROP_OUT=[
  {transform:'translateY(0) scale(1,1)',opacity:1,offset:0,easing:'ease-in'},
  {transform:'translateY(-3px) scale(.86,1.08)',opacity:1,offset:.35,easing:'cubic-bezier(.5,0,1,.6)'},
  {transform:'translateY(34px) scale(.07,.2)',opacity:0,offset:1}
];
const DROP_IN=[
  {transform:'translateY(-46px) scale(.07,.16)',opacity:0,offset:0,easing:'cubic-bezier(.4,0,.9,.6)'},
  {transform:'translateY(0) scale(.12,1.12)',opacity:1,offset:.3,easing:'cubic-bezier(.2,.7,.3,1)'},
  {transform:'translateY(0) scale(1.07,.88)',opacity:1,offset:.62,easing:'ease-in-out'},
  {transform:'translateY(0) scale(.98,1.03)',opacity:1,offset:.82,easing:'ease-out'},
  {transform:'translateY(0) scale(1,1)',opacity:1,offset:1}
];
const RADIUS=[{borderRadius:'27px',offset:0},{borderRadius:'27px',offset:.3},{borderRadius:'16px',offset:.7},{borderRadius:'16px',offset:1}];
function ui(){
  dots.forEach((d,i)=>d.classList.toggle('on',i===step-1));
  sub.textContent=SUB[step];
  gotxt.textContent=step===1?'ถัดไป':'เข้าสู่ระบบ';
  back.classList.toggle('hide',step===1);
  $('note').textContent=step===1?'ใช้เบอร์เดียวกันทุกครั้งเพื่อดูประวัติการสั่งซื้อ':'เมื่อกดเข้าสู่ระบบ จะขอใช้ตำแหน่งปัจจุบันเพื่อตั้งเป็นที่อยู่จัดส่งเริ่มต้น';
  if(step===2)backtxt.textContent=phoneEl.value;
  msg.textContent='';
}
function swap(to){
  if(to===step)return;
  const from=step===1?phoneF:nameF,inn=to===1?phoneF:nameF,fe=to===1?phoneEl:nameEl;
  inn.classList.remove('off');inn.removeAttribute('aria-hidden');from.setAttribute('aria-hidden','true');
  fe.focus({preventScroll:true}); // inside the tap so the keyboard stays up
  step=to;ui();
  if(still){from.classList.add('off');return}
  busy=true;if(!boosted){world.target=1.9;setTimeout(()=>{if(!boosted)world.target=1},750)}
  const a=from.animate(DROP_OUT,{duration:340,fill:'forwards'});
  inn.animate(DROP_IN,{duration:760,delay:190,fill:'backwards'});
  fe.animate(RADIUS,{duration:760,delay:190,fill:'backwards'});
  a.finished.then(()=>{from.classList.add('off');a.cancel()});
  setTimeout(()=>{busy=false},950);
}
// ---- real flow: Firestore customers/{phone} via ndCloud ----
const QS=new URLSearchParams(location.search);
const NOM='https://nominatim.openstreetmap.org';
const ua=navigator.userAgent,inApp=/Line\/|FBAN|FBAV|Instagram|Messenger/i.test(ua);
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const mask=n=>{n=(n||'').trim();return n?Array.from(n)[0]+'***':'ลูกค้า'};
function whenCloud(){return new Promise((ok,no)=>{let n=0;const t=setInterval(()=>{if(window.ndCloud){clearInterval(t);ok(window.ndCloud)}else if(++n>60){clearInterval(t);no(new Error('ยังเชื่อมต่อไม่ได้'))}},100)})}
function nextUrl(){
  const cand=[QS.get('next'),sessionStorage.getItem('loginReturnUrl'),sessionStorage.getItem('addrBack')];
  sessionStorage.removeItem('loginReturnUrl');sessionStorage.removeItem('addrBack');
  for(const u of cand){if(!u)continue;try{const x=new URL(u,location.href);if(x.origin===location.origin&&!/(login|signin|address)(-proto)?\.html$/i.test(x.pathname))return x.pathname.replace(/^\//,'')+x.search+x.hash}catch(e){}}
  return 'shops.html';
}
const clean=(a,ph)=>({name:a.name||'',phone:a.phone||ph,address:a.address||'',addrText:a.addrText||a.address||'',addrNote:a.addrNote||'',lat:a.lat==null?null:+(+a.lat).toFixed(6),lng:a.lng==null?null:+(+a.lng).toFixed(6),tag:a.tag||'บ้าน',label:a.label||a.tag||'บ้าน',placeName:a.placeName||'',...(a.auto?{auto:true}:{})});
const same=(a,b)=>a&&b&&a.lat!=null&&b.lat!=null&&Math.abs(a.lat-b.lat)<1e-5&&Math.abs(a.lng-b.lng)<1e-5;
// same rule as login.html: addresses[] first, primary (address/lat/lng) always first
function loadList(d){
  let l=Array.isArray(d.addresses)?d.addresses.map(x=>clean(x,d.phone)):[];
  if(d.address&&d.lat!=null){
    const p=clean({name:d.name,phone:d.phone,address:d.address,lat:d.lat,lng:d.lng,tag:'บ้าน',label:'บ้าน'},d.phone);
    const ex=l.find(a=>same(a,p));
    l=[ex||p,...l.filter(a=>a!==ex)];
  }
  return l.slice(0,5);
}
function saveLocal(phone,acc,list){
  const a=list[0]||{};
  try{
    localStorage.setItem('customerPhone',phone);
    localStorage.setItem('customerData',JSON.stringify({...acc,phone,name:acc.name||'',address:a.address||'',lat:a.lat==null?null:a.lat,lng:a.lng==null?null:a.lng,registered:true}));
    localStorage.setItem('addresses',JSON.stringify(list));
    localStorage.setItem('defaultAddress','0');
    const sa=ls('savedAccounts',[]),i=sa.findIndex(x=>x.phone===phone),en={phone,name:acc.name||'',address:a.address||'',lat:a.lat==null?null:a.lat,lng:a.lng==null?null:a.lng};
    if(i>=0)sa[i]=en;else sa.push(en);
    localStorage.setItem('savedAccounts',JSON.stringify(sa));
  }catch(e){}
}
// auto pin: current GPS position + reverse-geocoded address. null = denied/unavailable -> caller sends the customer to the manual pin page
function getPos(){return new Promise(ok=>{
  if(!navigator.geolocation){ok(null);return}
  let done=false;const t=setTimeout(()=>{if(!done){done=true;ok(null)}},14000);
  navigator.geolocation.getCurrentPosition(p=>{if(!done){done=true;clearTimeout(t);ok(p.coords)}},()=>{if(!done){done=true;clearTimeout(t);ok(null)}},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
})}
async function geoAddr(lat,lng){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);
  try{
    const r=await fetch(`${NOM}/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&namedetails=1&accept-language=th`,{signal:c.signal});
    const j=await r.json(),a=j.address||{},poi=j.name||(j.namedetails&&j.namedetails.name)||'';
    const road=[a.house_number,a.road].filter(Boolean).join(' ');
    const rest=[a.village||a.hamlet||a.suburb||a.neighbourhood,a.city_district||a.county,a.city||a.state,a.postcode].filter(Boolean).join(' ');
    const place=a.village||a.hamlet||a.town||a.suburb||a.neighbourhood||a.city_district||a.county||'';
    return{text:[poi,road,rest].filter(Boolean).join(' '),placeName:poi||road||place||''};
  }catch(e){return{text:'',placeName:''}}finally{clearTimeout(t)}
}
async function autoEntry(name,phone,pos){
  const g=await geoAddr(pos.latitude,pos.longitude);
  const txt=g.text||('พิกัด '+pos.latitude.toFixed(5)+', '+pos.longitude.toFixed(5));
  return clean({name,phone,address:txt,addrText:txt,addrNote:'',lat:pos.latitude,lng:pos.longitude,tag:'อื่นๆ',label:'ตำแหน่งปัจจุบัน',placeName:g.placeName,auto:true},phone);
}
function leave(url){
  boost(true);
  setTimeout(()=>location.replace(url),900);
  setTimeout(()=>{if(document.visibilityState==='visible'){go.disabled=false;gotxt.textContent=step===1?'ถัดไป':'เข้าสู่ระบบ';boost(false)}},4000);
}
const PIN_URL=()=>'login.html?mode=address&add=1&next='+encodeURIComponent(nextUrl());
function fail(m){go.disabled=false;gotxt.textContent=step===1?'ถัดไป':'เข้าสู่ระบบ';msg.textContent=m;shake()}
// found: existing customer. With an address on file go straight in, otherwise auto-pin once
async function loginKnown(cl,phone,d){
  let list=loadList(d);
  if(!list.length){
    gotxt.textContent='กำลังหาตำแหน่ง...';
    const pos=await getPos();
    if(pos){
      const en=await autoEntry(d.name,phone,pos);
      await cl.patch(phone,{addresses:[en],address:en.address,lat:en.lat,lng:en.lng});
      list=[en];saveLocal(phone,{...d},list);gotxt.textContent='กำลังเข้าสู่ระบบ...';leave(nextUrl());return;
    }
    saveLocal(phone,{...d},[]);gotxt.textContent='กำลังเข้าสู่ระบบ...';leave(PIN_URL());return;
  }
  saveLocal(phone,{...d},list);
  sub.textContent='ยินดีต้อนรับกลับ คุณ'+mask(d.name);gotxt.textContent='กำลังเข้าสู่ระบบ...';
  leave(nextUrl());
}
async function submit(){
  if(busy||go.disabled)return;
  const name=nameEl.value.trim(),phone=phoneEl.value.replace(/\D/g,'');
  if(!/^0\d{9}$/.test(phone)){if(step===2)swap(1);phoneEl.classList.add('bad');msg.textContent='กรุณากรอกเบอร์ 10 หลัก ขึ้นต้นด้วย 0';shake();phoneEl.focus();return}
  if(step===1){
    go.disabled=true;gotxt.textContent='กำลังตรวจสอบ...';msg.textContent='';
    try{
      const cl=await whenCloud(),d=await cl.get(phone);
      if(d&&d.registered&&d.name){await loginKnown(cl,phone,d);return}
      go.disabled=false;
      if(d&&d.name&&!nameEl.value)nameEl.value=d.name;
      swap(2);
    }catch(e){fail('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง')}
    return;
  }
  if(!name){nameEl.classList.add('bad');msg.textContent='กรุณากรอกชื่อ';shake();nameEl.focus();return}
  go.disabled=true;gotxt.textContent='กำลังหาตำแหน่ง...';msg.textContent='';
  try{
    const cl=await whenCloud();
    const pos=await getPos();
    const en=pos?await autoEntry(name,phone,pos):null;
    gotxt.textContent='กำลังสร้างบัญชี...';
    try{
      await cl.register(phone,en?{name,address:en.address,lat:en.lat,lng:en.lng,addresses:[en]}:{name});
    }catch(err){
      if(err&&err.message==='EXISTS'){const d=await cl.get(phone);if(d){await loginKnown(cl,phone,d);return}}
      throw err;
    }
    saveLocal(phone,{phone,name,registered:true},en?[en]:[]);
    gotxt.textContent='กำลังเข้าสู่ระบบ...';
    leave(en?nextUrl():PIN_URL());
  }catch(e){fail('สมัครไม่สำเร็จ ลองใหม่อีกครั้ง')}
}
back.addEventListener('click',()=>swap(1));
go.addEventListener('click',submit);
[nameEl,phoneEl].forEach(e=>e.addEventListener('keydown',ev=>{if(ev.key==='Enter')submit()}));
</script>
</body>
</html>
